<!DOCTYPE html><html lang="fa" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>بانکت | BANKET</title><style>
*{box-sizing:border-box}body{margin:0;padding:14px;background:#f4f1e9;color:#222;font-family:Tahoma,Arial}.app{max-width:900px;margin:auto}.top,.box{background:#fff;border:1px solid #c8a95d;border-radius:10px;padding:18px;margin-bottom:14px}.top{text-align:center;border-top:5px solid #b08b35}.logo{width:55px;height:55px;object-fit:contain}.gold{color:#99731e}h1{margin:6px}h3{margin-top:0}.muted{font-size:12px;color:#777}.grid,.items{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.field{margin-bottom:12px}label{display:block;font-size:13px;font-weight:bold;margin-bottom:6px}input,textarea{width:100%;padding:10px;border:1px solid #ccc;border-radius:6px;font:inherit}textarea{min-height:60px}.item{border:1px solid #ddd;border-radius:7px;padding:10px}.item strong{font-size:13px;display:block;margin-bottom:8px}.btn{border:0;border-radius:6px;padding:11px 15px;margin:3px;background:#a17c27;color:white;font:inherit;cursor:pointer}.dark{background:#222}.light{background:#eee;color:#222}.hide{display:none!important}#paper{display:none;background:white;color:#111}.paperhead{text-align:center;border-bottom:2px solid #b08b35;padding-bottom:10px;margin-bottom:12px}.paperhead img{width:42px;height:42px;object-fit:contain}.paperhead h2{margin:4px;font-size:18px}.paperhead p{font-size:10px;margin:4px}.doctitle{text-align:center;font-weight:bold;font-size:15px;margin:12px 0;color:#87671d}.info{display:grid;grid-template-columns:1fr 1fr;gap:6px;border:1px solid #d5c18c;padding:8px;font-size:10px;margin-bottom:10px}.info div{padding:2px}.sectiontitle{font-weight:bold;font-size:11px;margin:10px 0 6px;border-right:3px solid #b08b35;padding-right:6px}.goldtable{width:100%;border-collapse:collapse;font-size:9px}.goldtable th,.goldtable td{border:1px solid #c9b779;padding:6px;text-align:center}.goldtable th{background:#f6f0df}.statement{font-size:10px;line-height:2.2;text-align:justify;border:1px solid #d7c58f;padding:9px;margin-top:10px}.signs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin-top:17px}.sign{border:1px solid #c9b779;text-align:center;min-height:90px;padding:8px;font-size:10px;border-radius:4px}.line{margin-top:25px;border-top:1px dotted #777;padding-top:5px}.extras{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.extra{border:1px solid #c9b779;padding:8px;text-align:center;font-size:10px}.idimg{display:block;width:100%;height:auto;max-height:270px;object-fit:contain;object-position:center;margin:8px auto}.seal{width:62px;height:62px;border:3px double #987328;border-radius:50%;margin:7px auto;display:flex;align-items:center;justify-content:center;color:#987328;font-weight:bold;transform:rotate(-8deg)}.receiptSign{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}.receiptSign .sign{min-height:90px}.foot{text-align:center;border-top:1px solid #c9b779;margin-top:12px;padding-top:7px;font-size:9px;line-height:2}.foot a{color:#87671d;text-decoration:none}.actions{text-align:center;margin:15px 0}@media(max-width:560px){.grid,.items{grid-template-columns:1fr}.box,.top{padding:12px}}@page{margin:8mm}@media print{body{margin:0;padding:0;background:white}.app{display:none!important}#paper{display:block!important}#paper.a4{width:100%}#paper.a5{width:100%}#paper.a5 .paperhead{padding-bottom:5px;margin-bottom:6px}#paper.a5 .paperhead img{width:30px;height:30px}#paper.a5 .paperhead h2{font-size:14px}#paper.a5 .doctitle{font-size:12px;margin:7px 0}#paper.a5 .info{padding:5px;gap:3px;margin-bottom:6px}#paper.a5 .goldtable th,#paper.a5 .goldtable td{padding:4px}#paper.a5 .statement{font-size:9px;line-height:2;padding:7px;margin-top:7px}#paper.a5 .receiptSign{margin-top:9px;gap:6px}#paper.a5 .receiptSign .sign{min-height:72px}#paper.a5 .line{margin-top:17px}#paper.a5 .foot{margin-top:7px;padding-top:4px}#paper.a4 .idimg{max-height:270px;object-fit:contain}#paper.a4 .signs{margin-top:14px}#paper.a4 .sign{min-height:85px}#paper.a4 .foot{margin-top:8px}}
</style></head><body><div class="app"><header class="top"><img class="logo" src="https://banket.app/favicon.ico" alt="بانکت" onerror="this.style.display='none'"><h1>بانکت <span class="gold">BANKET</span></h1><p>سامانه ثبت و تحویل شمش طلا</p><p class="muted">ثبت سفارش و چاپ اسناد رسمی</p></header><div class="box"><h3 class="gold">۱. انتخاب برگه</h3><div class="grid"><button class="btn" onclick="setType('company')">گواهی شرکت A4</button><button class="btn dark" onclick="setType('customer')">رسید مشتری A5</button></div><p id="chosen" class="muted">نوع برگه را انتخاب کنید.</p></div><form class="box" onsubmit="return false"><h3 class="gold">۲. اطلاعات مشتری</h3><div class="grid"><div class="field"><label>نام و نام خانوادگی مشتری</label><input id="name" placeholder="نام کامل"></div><div class="field"><label>شماره ملی</label><input id="nid" inputmode="numeric" maxlength="10" placeholder="۱۰ رقم"></div><div class="field"><label>شماره تلفن</label><input id="phone" inputmode="numeric" maxlength="11" placeholder="09xxxxxxxxx"></div><div class="field"><label>نام تحویل‌دهنده</label><input id="d1"></div><div class="field"><label>نام تنظیم‌کننده صورت‌جلسه</label><input id="d2"></div></div><div class="field"><label>توضیحات اختیاری</label><textarea id="notes"></textarea></div><div id="idField" class="field hide"><label>تصویر روی کارت ملی مشتری</label><input type="file" id="idcard" accept="image/*" onchange="loadID(this)"><p class="muted">تصویر کامل نمایش داده می‌شود؛ کارت را با نور مناسب و بدون برش عکس بگیرید.</p></div><h3 class="gold">۳. انتخاب شمش‌های طلای زربد ۱۸ عیار</h3><p class="muted">تعداد هر مدل را وارد کنید.</p><div class="items" id="items"></div><p id="total" class="muted"></p><div class="actions"><button type="button" class="btn" onclick="preview()">ساخت برگه</button><button type="button" class="btn dark" onclick="printPaper()">چاپ / ذخیره PDF</button><button type="reset" class="btn light" onclick="resetAll()">پاک کردن فرم</button></div></form></div><div id="paper" class="a4"></div><script>
const P=[["نیم‌گرمی",.5],["۱ گرمی",1],["۲٫۵ گرمی",2.5],["۵ گرمی",5],["۱۰ گرمی",10],["۲۰ گرمی",20]];let type="",idData="";const $=x=>document.getElementById(x),fa=n=>Number(n).toLocaleString("fa-IR",{maximumFractionDigits:2}),norm=s=>String(s||"").replace(/[۰-۹]/g,d=>"۰۱۲۳۴۵۶۷۸۹".indexOf(d)).replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d));const ones=["صفر","یک","دو","سه","چهار","پنج","شش","هفت","هشت","نه","ده","یازده","دوازده","سیزده","چهارده","پانزده","شانزده","هفده","هجده","نوزده"],tens=["","","بیست","سی","چهل","پنجاه","شصت","هفتاد","هشتاد","نود"],hund=["","صد","دویست","سیصد","چهارصد","پانصد","ششصد","هفتصد","هشتصد","نهصد"];function words(n){n=Math.floor(Number(n)||0);if(n<20)return ones[n];if(n<100)return tens[Math.floor(n/10)]+(n%10?" و "+words(n%10):"");if(n<1000)return hund[Math.floor(n/100)]+(n%100?" و "+words(n%100):"");if(n<1e6)return words(Math.floor(n/1000))+" هزار"+(n%1000?" و "+words(n%1000):"");return String(n)}function weightWords(n){if(n===.5)return"نیم";if(n===2.5)return"دو و نیم";return words(n)}function setType(t){type=t;$("chosen").textContent=t==="company"?"گواهی شرکت A4 انتخاب شد.":"رسید مشتری A5 انتخاب شد.";$("idField").classList.toggle("hide",t!=="company")}function makeItems(){$("items").innerHTML=P.map((p,i)=>`<div class="item"><strong>شمش طلای زربد ${p[0]} ۱۸ عیار</strong><label>تعداد</label><input type="number" min="0" step="1" value="0" id="q${i}" oninput="updateTotal()"></div>`).join("")}function selected(){return P.map((p,i)=>({name:p[0],w:p[1],q:Math.max(0,parseInt($("q"+i).value)||0)})).filter(x=>x.q>0)}function updateTotal(){let a=selected(),q=a.reduce((s,x)=>s+x.q,0),w=a.reduce((s,x)=>s+x.q*x.w,0);$("total").textContent=q?`مجموع: ${fa(q)} عدد، وزن کل ${fa(w)} گرم`:"هنوز شمشی انتخاب نشده است."}function loadID(i){let f=i.files&&i.files[0];if(!f){idData="";return}if(!f.type.startsWith("image/")){alert("لطفاً فایل تصویر انتخاب کنید.");return}let r=new FileReader();r.onload=()=>idData=r.result;r.readAsDataURL(f)}function dateNow(){return new Date().toLocaleString("fa-IR",{dateStyle:"short",timeStyle:"short"})}function esc(s){return String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}function rows(a){return a.map((x,i)=>`<tr><td>${fa(i+1)}</td><td>شمش طلای زربد ${x.name} ۱۸ عیار</td><td>${fa(x.q)} عدد<br>به حروف: ${words(x.q)} عدد</td><td>${fa(x.q*x.w)} گرم<br>به حروف: ${weightWords(x.q*x.w)} گرم</td></tr>`).join("")}function sign(t,n,extra=""){return`<div class="sign"><b>${t}</b><div>${esc(n)}</div>${extra}<div class="line">امضا و تاریخ</div></div>`}function seal(){return`<div class="extra"><b>مهر شرکت بانکت</b><div class="seal">بانکت<br>BANKET</div></div>`}function preview(){if(!type){alert("ابتدا نوع برگه را انتخاب کنید.");return}let name=$("name").value.trim(),nid=norm($("nid").value),phone=norm($("phone").value);if(!name){alert("نام مشتری را وارد کنید.");return}if(!/^\d{10}$/.test(nid)){alert("شماره ملی باید ۱۰ رقم باشد.");return}if(!/^09\d{9}$/.test(phone)){alert("شماره تلفن باید ۱۱ رقم و با 09 شروع شود.");return}let a=selected();if(!a.length){alert("حداقل یک شمش انتخاب کنید.");return}let co=type==="company",q=a.reduce((s,x)=>s+x.q,0),w=a.reduce((s,x)=>s+x.q*x.w,0),date=dateNow(),signs=co?`<div class="signs">${sign("تحویل‌دهنده",$("d1").value)}${sign("تنظیم‌کننده صورت‌جلسه",$("d2").value)}${sign("تحویل‌گیرنده",name,"<div>امضای مشتری و اثر انگشت</div>")}</div>`:`<div class="receiptSign">${sign("مهر شرکت بانکت","")} ${sign("امضای تحویل‌دهنده / مسئول",$("d1").value)}</div>`,extras=co?`<div class="extras"><div class="extra"><b>تصویر روی کارت ملی مشتری</b>${idData?`<img class="idimg" src="${idData}" alt="تصویر کامل کارت ملی">`:`<p>تصویر بارگذاری نشده است</p>`}</div>${seal()}</div>`:"",statement=`اینجانب ${esc(name)} به شماره ملی ${fa(nid)} و شماره تلفن ${fa(phone)}، در تاریخ ${date}، سفارش خود را از بانکت که شامل مشخصات شمش‌های طلای انتخاب‌شده به عدد و حروف و مندرج در این رسید است، تحویل گرفتم.`;$("paper").className=co?"a4":"a5";$("paper").innerHTML=`<div class="paperhead"><img src="https://banket.app/favicon.ico" alt="بانکت" onerror="this.style.display='none'"><h2>بانکت <span class="gold">BANKET</span></h2><p>سامانه ثبت و تحویل شمش طلا</p></div><div class="doctitle">${co?"گواهی تحویل شمش طلا":"رسید تحویل مشتری"}</div><div class="info"><div><b>نام مشتری:</b> ${esc(name)}</div><div><b>شماره ملی:</b> ${fa(nid)}</div><div><b>تلفن:</b> ${fa(phone)}</div><div><b>تاریخ و ساعت:</b> ${date}</div>${co?`<div><b>تحویل‌دهنده:</b> ${esc($("d1").value)}</div><div><b>تنظیم‌کننده صورت‌جلسه:</b> ${esc($("d2").value)}</div>`:""}</div><div class="sectiontitle">مشخصات شمش‌های طلای تحویل‌شده</div><table class="goldtable"><thead><tr><th>ردیف</th><th>مشخصات شمش</th><th>تعداد به عدد و حروف</th><th>وزن به عدد و حروف</th></tr></thead><tbody>${rows(a)}</tbody></table><div class="info" style="margin-top:8px"><div><b>مجموع تعداد:</b> ${fa(q)} عدد (${words(q)} عدد)</div><div><b>وزن کل:</b> ${fa(w)} گرم (${weightWords(w)} گرم)</div></div>${$("notes").value.trim()?`<div class="sectiontitle">توضیحات</div><div style="font-size:10px;line-height:2">${esc($("notes").value)}</div>`:""}${co?signs+extras:`<div class="statement">${statement}</div>${signs}`}<div class="foot">بانکت | <a href="https://banket.app">banket.app</a><br>آدرس: کوروش مال، طبقه منفی ۱، پلاک ۱۱<br>تلفن: ۰۲۱۴۴۰۳۵۲۴۵</div>`;$("paper").scrollIntoView({behavior:"smooth"})}function printPaper(){if(!$("paper").innerHTML.trim()){preview();if(!$("paper").innerHTML.trim())return}window.print()}function resetAll(){setTimeout(()=>{type="";idData="";$("paper").innerHTML="";$("chosen").textContent="نوع برگه را انتخاب کنید.";$("idField").classList.add("hide");updateTotal()},10)}makeItems();updateTotal();
</script></body></html>
