<!doctype html><html lang="fa" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PARSGUARD | قراردادهای سرمایه‌گذاری</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#29210b 0,#0b0b0b 35%,#050505 100%);color:#eee;font-family:tahoma,Arial,sans-serif;min-height:100vh}header{padding:28px 15px;text-align:center;border-bottom:1px solid #8d6b18;background:rgba(0,0,0,.65)}header h1{margin:0;color:#d6ad3c;font-size:30px}header p{color:#aaa;margin:10px 0 0}.wrap{max-width:1100px;margin:auto;padding:20px}.card{background:linear-gradient(145deg,#151515,#090909);border:1px solid #725716;border-radius:20px;padding:22px;margin-bottom:20px;box-shadow:0 10px 35px #000}.title{color:#e0b93f;font-size:22px;font-weight:bold;margin-bottom:15px}.types{display:grid;grid-template-columns:repeat(2,1fr);gap:15px}.type{padding:25px;text-align:center;border:1px solid #80631e;border-radius:18px;background:#111;cursor:pointer;transition:.3s}.type:hover{transform:translateY(-5px);box-shadow:0 10px 30px #7b5b1022}.type b{display:block;color:#e5bd48;font-size:20px;margin-bottom:8px}.type span{color:#aaa}label{display:block;color:#d9b64a;margin:12px 0 6px}input,select{width:100%;padding:13px;border-radius:10px;border:1px solid #765b1b;background:#090909;color:#fff;font-size:15px;outline:none}input:focus,select:focus{border-color:#d5ad37}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:15px}.alloc{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.alloc div{background:#0b0b0b;border:1px solid #4d3b12;padding:10px;border-radius:10px}.alloc input{margin-top:5px}.btn{border:0;border-radius:12px;padding:14px 20px;background:linear-gradient(135deg,#b88b18,#f0ce58,#9b7211);color:#111;font-weight:bold;cursor:pointer;font-size:16px;margin-top:18px}.btn:hover{filter:brightness(1.15);transform:translateY(-1px)}.hidden{display:none}.sigbox{background:#fff;border-radius:12px;padding:5px;margin-top:8px}.sigbox canvas{width:100%;height:180px;display:block;touch-action:none;cursor:crosshair}.clear{background:#222;color:#ddd;border:1px solid #6e5317;padding:8px 14px;border-radius:8px;margin-top:8px;cursor:pointer}.certificate{background:#f4f0df;color:#181818;border:7px double #b28a25;border-radius:12px;padding:30px;margin-top:20px}.certificate h2{text-align:center;color:#876313}.certhead{text-align:center;border-bottom:2px solid #b28a25;padding-bottom:15px}.certgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:18px 0}.certitem{padding:10px;border-bottom:1px solid #bbb}.certtext{line-height:2;text-align:justify}.signatures{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:25px;text-align:center}.signatures img{max-width:150px;max-height:100px}.stamp{width:110px;height:110px;border:3px solid #9b2020;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#9b2020;margin:auto;font-weight:bold;transform:rotate(-12deg)}.note{background:#fff1bd;border:1px solid #d0a52e;color:#5b4810;padding:12px;border-radius:10px;margin-top:15px;font-size:13px}.print{display:block;margin:20px auto}.success{color:#9fdc72;margin-top:12px}@media(max-width:700px){.types,.grid,.alloc,.certgrid,.signatures{grid-template-columns:1fr}header h1{font-size:24px}.wrap{padding:10px}.card{padding:15px}}@media print{body{background:#fff}.no-print{display:none!important}.certificate{box-shadow:none;margin:0}}</style></head><body><header><h1>⚖️ PARSGUARD</h1><p>سامانه آزمایشی مدیریت و صدور قراردادهای سرمایه‌گذاری</p></header><main class="wrap"><section class="card"><div class="title">نوع قرارداد را انتخاب کنید</div><div class="types"><div class="type" onclick="choose('فلزات')"><b>🟡 سبد فلزات</b><span>طلا، نقره و مس</span></div><div class="type" onclick="choose('سهام')"><b>📈 سبد سهام</b><span>دامداری، بانکت، گردشگری تکاب و کشت و صنعت</span></div></div></section><section id="formCard" class="card hidden"><div class="title" id="formTitle">اطلاعات قرارداد</div><div class="grid"><div><label>نام و نام خانوادگی</label><input id="name" placeholder="مثلاً پارسا کرمی"></div><div><label>کد ملی</label><input id="national" inputmode="numeric" placeholder="کد ملی"></div><div><label>شماره تماس</label><input id="phone" inputmode="tel" placeholder="شماره تماس"></div><div><label>مدت قرارداد</label><select id="duration"><option value="3">۳ ماهه</option><option value="6">۶ ماهه</option><option value="12">۱۲ ماهه</option><option value="18">۱۸ ماهه</option><option value="24">۲۴ ماهه</option></select></div><div><label>مبلغ کل قرارداد (تومان)</label><input id="amount" type="number" placeholder="مثلاً 2000000"></div></div><div style="margin-top:20px"><div class="title" style="font-size:18px">تخصیص سبد</div><div class="alloc" id="metalAlloc"><div>طلا<input id="gold" type="number" value="40" min="0" max="100"></div><div>نقره<input id="silver" type="number" value="35" min="0" max="100"></div><div>مس<input id="copper" type="number" value="25" min="0" max="100"></div></div><div class="alloc hidden" id="stockAlloc"><div>دامداری<input id="farm" type="number" value="25" min="0" max="100"></div><div>بانکت<input id="bank" type="number" value="25" min="0" max="100"></div><div>گردشگری تکاب<input id="tour" type="number" value="25" min="0" max="100"></div><div>کشت و صنعت<input id="agri" type="number" value="25" min="0" max="100"></div></div></div><label>امضای دیجیتال مشتری</label><div class="sigbox"><canvas id="signature"></canvas></div><button class="clear no-print" id="clearBtn">پاک کردن امضا</button><br><button class="btn no-print" onclick="issue()">صدور قرارداد نمونه</button><div id="msg"></div></section><section id="result" class="certificate hidden"></section></main><script>const $=id=>document.getElementById(id);let selected="فلزات",cv=$("signature"),ctx=cv.getContext("2d"),drawing=false,hasDrawn=false;function choose(type){selected=type;$("formCard").classList.remove("hidden");$("formTitle").textContent="اطلاعات قرارداد "+type;if(type==="فلزات"){$("metalAlloc").classList.remove("hidden");$("stockAlloc").classList.add("hidden")}else{$("metalAlloc").classList.add("hidden");$("stockAlloc").classList.remove("hidden")}window.scrollTo({top:$("formCard").offsetTop-10,behavior:"smooth"})}function fit(){let r=cv.getBoundingClientRect(),d=devicePixelRatio||1;cv.width=Math.max(1,r.width*d);cv.height=180*d;ctx.setTransform(d,0,0,d,0,0);ctx.lineWidth=2.5;ctx.lineCap="round";ctx.lineJoin="round";ctx.strokeStyle="#111"}fit();addEventListener("resize",fit);function pos(e){let r=cv.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}function down(e){drawing=true;hasDrawn=true;let p=pos(e);ctx.beginPath();ctx.moveTo(p.x,p.y);if(e.pointerId!=null)try{cv.setPointerCapture(e.pointerId)}catch(_){}e.preventDefault()}function move(e){if(!drawing)return;let p=pos(e);ctx.lineTo(p.x,p.y);ctx.stroke();e.preventDefault()}function up(e){drawing=false;if(e.pointerId!=null)try{cv.releasePointerCapture(e.pointerId)}catch(_){}e.preventDefault()}cv.addEventListener("pointerdown",down);cv.addEventListener("pointermove",move);cv.addEventListener("pointerup",up);cv.addEventListener("pointercancel",up);$("clearBtn").onclick=()=>{ctx.clearRect(0,0,cv.width,cv.height);hasDrawn=false};function issue(){let name=$("name").value.trim(),national=$("national").value.trim(),phone=$("phone").value.trim(),amount=Number($("amount").value),duration=Number($("duration").value);if(!name||!national||!phone||!amount){alert("لطفاً تمام اطلاعات را وارد کنید.");return}let arr=selected==="فلزات"?[{n:"طلا",v:+$("gold").value},{n:"نقره",v:+$("silver").value},{n:"مس",v:+$("copper").value}]:[{n:"دامداری",v:+$("farm").value},{n:"بانکت",v:+$("bank").value},{n:"گردشگری تکاب",v:+$("tour").value},{n:"کشت و صنعت",v:+$("agri").value}];let total=arr.reduce((a,x)=>a+x.v,0);if(total!==100){alert("درصدهای سبد باید دقیقاً ۱۰۰٪ باشند.");return}if(!hasDrawn){alert("لطفاً امضای دیجیتال مشتری را وارد کنید.");return}let issueDate=new Date(),expire=new Date(issueDate);expire.setMonth(expire.getMonth()+duration);let fmt=d=>d.toLocaleDateString("fa-IR"),num=Math.floor(100000+Math.random()*900000),alloc=arr.map(x=>"<div class='certitem'><b>"+x.n+":</b> "+x.v+"٪ — "+Math.round(amount*x.v/100).toLocaleString("fa-IR")+" تومان</div>").join(""),sig=cv.toDataURL("image/png");$("result").innerHTML="<div class='certhead'><h2>گواهی و قرارداد نمونه PARSGUARD</h2><div>سامانه آزمایشی مدیریت قراردادهای سرمایه‌گذاری</div></div><div class='certgrid'><div class='certitem'><b>شماره قرارداد:</b> PG-"+num+"</div><div class='certitem'><b>نوع قرارداد:</b> سبد "+selected+"</div><div class='certitem'><b>نام مشتری:</b> "+name+"</div><div class='certitem'><b>کد ملی:</b> "+national+"</div><div class='certitem'><b>شماره تماس:</b> "+phone+"</div><div class='certitem'><b>مبلغ:</b> "+amount.toLocaleString("fa-IR")+" تومان</div><div class='certitem'><b>مدت:</b> "+duration+" ماه</div><div class='certitem'><b>تاریخ صدور:</b> "+fmt(issueDate)+"</div><div class='certitem'><b>تاریخ اعتبار:</b> "+fmt(expire)+"</div><div class='certitem'><b>وضعیت:</b> نمونه آزمایشی</div></div><h3>ترکیب سبد</h3><div class='certgrid'>"+alloc+"</div><div class='certtext'><p>این سند صرفاً یک قرارداد و گواهی نمونه آزمایشی برای نمایش فرایند ثبت اطلاعات، تخصیص سبد، امضای دیجیتال و صدور گواهی در سامانه PARSGUARD است. این سند به‌تنهایی ایجادکننده تعهد مالی، مالکیت دارایی، بیمه، تضمین سود یا رابطه قراردادی واقعی نیست.</p><p>مشتری با ثبت اطلاعات و امضای دیجیتال نمونه، ترکیب انتخابی سبد و مبلغ فرضی قرارداد را تأیید می‌کند. هرگونه استفاده واقعی از خدمات مالی، سرمایه‌گذاری، بیمه یا قراردادهای مشابه منوط به مجوزها، قراردادهای معتبر و فرایندهای قانونی مربوط خواهد بود.</p></div><div class='signatures'><div><b>امضای مشتری</b><br><img src='"+sig+"'></div><div><b>مهر شرکت</b><br><div class='stamp'>PARSGUARD<br>نمونه</div></div><div><b>نماینده شرکت</b><br><div style='font-family:cursive;font-size:25px;margin:25px 0'>Parsa Karami</div></div></div><div class='note'>⚠️ این گواهی آزمایشی است و سند رسمی سرمایه‌گذاری یا تعهد مالی محسوب نمی‌شود.</div><button class='btn print no-print' onclick='window.print()'>🖨 چاپ / ذخیره گواهی</button>";$("result").classList.remove("hidden");$("result").scrollIntoView({behavior:"smooth"})}</script></body></html>
