<!DOCTYPE html><html lang="fa" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BANKET | بانکت</title><style>*{box-sizing:border-box}body{margin:0;background:#f2efe7;color:#29251e;font:14px Tahoma,Arial}.wrap{max-width:950px;margin:20px auto;padding:15px}.box{background:#fff;padding:22px;border:1px solid #dfc98c;border-radius:12px;margin-bottom:15px;box-shadow:0 4px 18px #0000000a}.head{display:flex;align-items:center;justify-content:center;gap:16px;border-bottom:2px solid #b79750;padding-bottom:15px;margin-bottom:18px}.brand{display:flex;align-items:center;gap:7px}.brand img{width:38px;height:38px;object-fit:contain}.brand b{font-size:23px;font-weight:1000;letter-spacing:-1.5px}.brand small{display:block;font-size:12px;text-align:center;margin-top:4px}.divider{height:38px;border-left:1px solid #c9ad69}.sub{font-size:12px;color:#8a7139}.title{text-align:center;font-size:20px;color:#94752e;margin:18px 0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}label{display:block;font-size:12px;margin-bottom:6px;color:#65583e}input,select,textarea{width:100%;padding:11px;border:1px solid #d9cfb7;border-radius:7px;background:#fff;font:13px Tahoma}textarea{min-height:65px}.field{margin-bottom:12px}.btns{display:flex;flex-wrap:wrap;gap:9px;margin:15px 0}button{border:0;border-radius:7px;padding:12px 17px;background:#98772f;color:white;font:13px Tahoma;cursor:pointer}button.secondary{background:#38352e}button.light{background:#eee5d0;color:#46391f}.items{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.item{border:1px solid #ddd0ae;border-radius:8px;padding:10px}.item label{display:flex;align-items:center;gap:6px;line-height:1.8}.item input[type=checkbox]{width:auto}.item input[type=number]{padding:6px;margin-top:5px}.hidden{display:none!important}.paper{background:#fff;border:1px solid #c9b477;padding:25px;margin-top:18px;color:#25231e}.paper h2{text-align:center;color:#8c6c2a;font-size:20px}.paper p{line-height:2.3}.paper .sentence{font-size:14px;line-height:2.8;text-align:justify}.signs{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:40px;text-align:center}.sign{min-height:85px;border-top:1px solid #bba56d;padding-top:12px;font-size:12px}.foot{border-top:1px solid #c9b477;margin-top:25px;padding-top:12px;text-align:center;font-size:10px;line-height:2;color:#6d603f}.photo{max-width:180px;max-height:120px;object-fit:contain;display:block;margin:8px 0}.stamp{height:70px;width:120px;border:1px dashed #bdb19a;margin:10px auto}.muted{font-size:11px;color:#80745e}@media(max-width:600px){.grid,.items{grid-template-columns:1fr}.wrap{padding:8px}.box{padding:13px}.head{gap:8px}.brand b{font-size:19px}.paper{padding:13px}.signs{gap:5px}.sign{font-size:10px}}@media print{body{background:white}.wrap,.box,.noprint{display:none!important}.paper{display:block!important;border:0;margin:0;padding:8mm;box-shadow:none}.paper.a4{width:210mm;min-height:285mm}.paper.a5{width:148mm;min-height:200mm;padding:6mm}.paper.a5 h2{font-size:17px}.paper.a5 .sentence{font-size:13px}.paper.a5 .signs{grid-template-columns:1fr;margin-top:25px}.paper.a5 .foot{margin-top:15px}@page{margin:8mm}}</style></head><body><main class="wrap"><section class="box" id="start"><div class="head"><div class="brand"><img src="https://banket.app/favicon.ico" alt="بانکت"><div><b>BANKET</b><small>بانکت</small></div></div><div class="divider"></div><div class="brand"><div><b style="font-size:20px;letter-spacing:-1px">BANVEST</b><small>بان‌وست</small></div></div></div><div class="sub" style="text-align:center">بسمه تعالی</div><h2 class="title">سامانه رسید تحویل طلای فیزیکی</h2><div class="field"><label>انتخاب شرکت</label><select id="company"><option value="بانکت">بانکت | BANKET</option><option value="بان‌وست">بان‌وست | BANVEST</option></select></div><div class="btns"><button onclick="step(1)">ورود به سامانه</button></div></section><section class="box hidden" id="form"><h2 class="title">اطلاعات رسید</h2><div class="field"><label>نوع رسید</label><select id="kind"><option value="a4">رسید A4 شرکت</option><option value="a5">رسید A5 مشتری</option></select></div><div class="grid"><div class="field"><label>شماره رسید</label><input id="num" placeholder="شماره رسید را وارد کنید"></div><div class="field"><label>نام مشتری</label><input id="name" placeholder="نام و نام خانوادگی"></div><div class="field"><label>کد ملی</label><input id="national" inputmode="numeric"></div><div class="field"><label>شماره تلفن</label><input id="phone" inputmode="tel"></div></div><h3>انتخاب شمش طلا</h3><div class="items" id="items"></div><div class="field" style="margin-top:15px"><label>عیار</label><select id="karat"><option value="۱۸">۱۸ عیار</option></select></div><div class="field"><label>آدرس مشتری (اختیاری)</label><input id="address"></div><div class="field"><label>نام تحویل‌دهنده</label><input id="deliverer" placeholder="نام تحویل‌دهنده"></div><div class="field"><label>نام تنظیم‌کننده صورت جلسه</label><input id="editor" placeholder="نام تنظیم‌کننده"></div><div class="field"><label>تصویر روی کارت ملی مشتری (فقط رسید A4)</label><input id="card" type="file" accept="image/*"><img id="cardimg" class="photo hidden"></div><div class="btns"><button onclick="makeReceipt()">ساخت رسید</button><button class="secondary" onclick="step(0)">بازگشت</button></div></section><section class="box hidden" id="result"><div class="btns noprint"><button onclick="printReceipt()">چاپ رسید</button><button class="secondary" onclick="step(1)">ویرایش اطلاعات</button><button class="light" onclick="step(0)">صفحه اول</button></div><div id="paper" class="paper"></div></section></main><script>const products=[["شمش طلای زربد ۰/۵ گرمی ۱۸ عیار","نیم‌گرمی",.5],["شمش طلای زربد ۱ گرمی ۱۸ عیار","۱ گرمی",1],["شمش طلای زربد ۵ گرمی ۱۸ عیار","۵ گرمی",5],["شمش طلای زربد ۱۰ گرمی ۱۸ عیار","۱۰ گرمی",10],["شمش طلای زربد ۲۰ گرمی ۱۸ عیار","۲۰ گرمی",20]];const $=id=>document.getElementById(id);$("items").innerHTML=products.map((p,i)=>`<div class="item"><label><input type="checkbox" id="c${i}">${p[0]}</label><label>تعداد</label><input type="number" id="q${i}" min="1" value="1"></div>`).join("");function step(n){$("start").classList.toggle("hidden",n!==0);$("form").classList.toggle("hidden",n!==1);$("result").classList.toggle("hidden",n!==2)}$("card").addEventListener("change",e=>{let f=e.target.files[0];if(f){$("cardimg").src=URL.createObjectURL(f);$("cardimg").classList.remove("hidden")}});function words(n){let u=["صفر","یک","دو","سه","چهار","پنج","شش","هفت","هشت","نه"],t=["","","بیست","سی","چهل","پنجاه","شصت","هفتاد","هشتاد","نود"],te=["ده","یازده","دوازده","سیزده","چهارده","پانزده","شانزده","هفده","هجده","نوزده"],h=["","یکصد","دویست","سیصد","چهارصد","پانصد","ششصد","هفتصد","هشتصد","نهصد"];function part(x){let a=[];if(x>=100){a.push(h[Math.floor(x/100)]);x%=100}if(x>=20){a.push(t[Math.floor(x/10)]);x%=10}else if(x>=10){a.push(te[x-10]);x=0}if(x)a.push(u[x]);return a.join(" و ")}if(n===0)return"صفر";let a=[];if(n>=1000000){a.push(part(Math.floor(n/1000000))+" میلیون");n%=1000000}if(n>=1000){a.push(part(Math.floor(n/1000))+" هزار");n%=1000}if(n)a.push(part(n));return a.join(" و ")}function qty(){let a=[],grams=0;products.forEach((p,i)=>{if($("c"+i).checked){let q=Math.max(1,parseInt($("q"+i).value)||1);a.push(`${q} عدد ${p[1]} (${p[0]})`);grams+=p[2]*q}});return{a,grams}}function makeReceipt(){let d=new Date(),date=d.toLocaleDateString("fa-IR"),time=d.toLocaleTimeString("fa-IR",{hour:"2-digit",minute:"2-digit"}),q=qty();if(!q.a.length){alert("حداقل یک شمش انتخاب کنید.");return}let company=$("company").value,name=$("name").value||"........................",national=$("national").value||"................",phone=$("phone").value||"................",items=q.a.join("، "),karat=$("karat").value,kind=$("kind").value,desc=`${items} به میزان ${q.grams} (${words(Math.floor(q.grams))}${q.grams%1?" و نیم":""}) گرم با عیار ${karat} عیار`;let header=`<div class="head"><div class="brand"><img src="https://banket.app/favicon.ico" alt="بانکت"><div><b>BANKET</b><small>بانکت</small></div></div><div class="divider"></div><div class="brand"><div><b style="font-size:20px">BANVEST</b><small>بان‌وست</small></div></div></div><div style="text-align:center;font-size:11px">بسمه تعالی</div><h2>رسید تحویل طلای فیزیکی</h2><p>شرکت: ${company} <span style="float:left">شماره رسید: ${$("num").value||"................"}</span></p><p>تاریخ تحویل: ${date} <span style="float:left">ساعت تحویل: ${time}</span></p>`;let sentence=`اینجانب ${name} به شماره ملی ${national} و شماره تلفن ${phone} در تاریخ ${date} سفارش خود را که در درگاه ${company} انجام داده بودم شامل ${items} به میزان ${q.grams} گرم (${words(Math.floor(q.grams))}${q.grams%1?" و نیم":""} گرم) با عیار ${karat} عیار از نماینده ${company} تحویل گرفتم.`;let body=kind==="a5"?`<p class="sentence">${sentence}</p><div class="signs"><div class="sign">تحویل‌دهنده<br><br>${$("deliverer").value||""}</div></div><div style="text-align:center;margin-top:15px;font-size:11px">مهر شرکت</div><div class="stamp"></div>`:`<p>مشخصات مشتری: ${name} | کد ملی: ${national} | تلفن: ${phone}</p><p class="sentence">مشخصات شمش: ${desc}</p><p>نشانی مشتری: ${$("address").value||"................................................"}</p>${$("cardimg").classList.contains("hidden")?"":`<p>تصویر روی کارت ملی مشتری:</p><img class="photo" src="${$("cardimg").src}">`}<div class="signs"><div class="sign">تحویل‌دهنده<br><br>${$("deliverer").value||""}</div><div class="sign">تنظیم‌کننده صورت جلسه<br><br>${$("editor").value||""}</div><div class="sign">مشتری<br><br>${name}<br>اثر انگشت</div></div>`;let footer=`<div class="foot">آدرس: کوروش مال طبقه منفی یک پلاک ۱۱<br>تلفن: 02144035245 | وب‌سایت: Blanket.app | ایمیل: Info@banket.app</div>`;$("paper").className="paper "+kind;$("paper").innerHTML=header+body+footer;step(2)}function printReceipt(){window.print()}</script></body></html>
