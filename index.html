<!doctype html><html lang="fa" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PARSGUARD | گواهی سرمایه‌گذاری</title>
<style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#49360a,#080808 42%,#000);color:#eee;font-family:Tahoma,Arial,sans-serif}.wrap{max-width:900px;margin:auto;padding:18px}.brand{text-align:center;font-size:28px;font-weight:900;color:#d8b45a;letter-spacing:2px}.sub{text-align:center;color:#aaa;margin:5px 0 18px}.box{background:linear-gradient(145deg,#151515,#080808);border:1px solid #725b22;border-radius:18px;padding:20px;box-shadow:0 12px 40px #000}.steps{display:flex;gap:5px;margin-bottom:15px}.step{flex:1;text-align:center;padding:8px 3px;border:1px solid #333;border-radius:9px;color:#777;font-size:11px}.step.on{border-color:#cda94e;color:#e3c76b;background:#17130a}.cardgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:15px}.choice{cursor:pointer;border:1px solid #444;border-radius:15px;padding:24px;text-align:center;background:#101010;transition:.2s}.choice:hover,.choice.sel{border-color:#d5af55;box-shadow:0 0 20px #8d6b2040}.choice .ico{font-size:45px}.choice b{display:block;font-size:20px;margin:10px}.choice small{color:#999}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{margin-bottom:12px}.field label{display:block;font-size:12px;color:#bbb;margin-bottom:6px}.field input,.field select{width:100%;padding:13px;border-radius:10px;border:1px solid #444;background:#080808;color:#fff;outline:none}.field input:focus,.field select:focus{border-color:#cda94e}.btns{display:flex;gap:9px;margin-top:18px}.btn{border:0;border-radius:10px;padding:12px 18px;cursor:pointer;font-weight:bold}.next{background:linear-gradient(135deg,#e4c36a,#987323);color:#111;flex:1}.back{background:#191919;color:#ddd;border:1px solid #555}.danger{background:#351313;color:#ffb0b0;border:1px solid #633}.hidden{display:none!important}.summary{border:1px solid #59471d;border-radius:12px;padding:15px;line-height:2;background:#0c0c0c}.alloc{display:grid;grid-template-columns:1fr 100px;gap:8px;align-items:center;margin:8px 0}.alloc input{padding:9px!important}.total{padding:12px;border-radius:10px;text-align:center;background:#151515;margin-top:12px}.ok{color:#70dc9a}.bad{color:#ff7373}.transfer{border-top:1px solid #333;margin-top:18px;padding-top:15px}.history{font-size:12px;color:#bbb;line-height:2;margin-top:10px}.signature{background:#fff;border-radius:10px;display:block;width:100%;height:190px;touch-action:none}.sigbox{background:#171717;padding:12px;border-radius:12px}.certwrap{display:flex;justify-content:center;margin-top:15px}.certificate{width:820px;min-height:1080px;background:#f8f5ed;color:#171717;padding:30px;border:8px double #a9822d;position:relative;box-shadow:0 10px 35px #000;overflow:hidden}.certificate:before{content:"";position:absolute;inset:12px;border:1px solid #b59651;pointer-events:none}.certhead{text-align:center;border-bottom:2px solid #a9822d;padding:10px 20px 15px;position:relative}.certlogo{font-size:42px}.certtitle{font-size:28px;font-weight:900;color:#6f541b;margin:6px}.certsub{font-size:13px;color:#555}.meta{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:15px 0}.meta div{border:1px solid #cbbd99;padding:8px;text-align:center;background:#f1ecde;font-size:12px}.certintro{font-size:14px;line-height:2;text-align:justify;margin:15px 5px}.ctable{width:100%;border-collapse:collapse;font-size:12px;margin:15px 0}.ctable th{background:#29230f;color:#fff}.ctable th,.ctable td{border:1px solid #9c895b;padding:9px;text-align:center}.ctable td{background:#fffdf8}.certfooter{display:grid;grid-template-columns:1fr 1fr;gap:25px;margin-top:25px;text-align:center}.signline{height:65px;border-bottom:1px solid #777;margin:5px 20px}.rep{font-family:cursive;font-size:22px}.seal{width:82px;height:82px;border:3px double #80631f;border-radius:50%;margin:auto;display:flex;align-items:center;justify-content:center;font-size:11px;color:#80631f;font-weight:bold;transform:rotate(-8deg)}.certbuttons{display:flex;gap:8px;justify-content:center;margin:15px auto;max-width:820px}.certbuttons button{padding:12px 20px}.mine{font-size:45px;margin-bottom:4px}.eagle{font-size:52px;margin-bottom:2px}.stockcert{border-color:#24364b}.stockcert .certhead{border-color:#526c89}.stockcert .certtitle{color:#263e5c}.stockcert .ctable th{background:#25384e}.letter{font-family:Georgia,serif;letter-spacing:1px}.notice{padding:10px;border:1px solid #59471d;border-radius:9px;color:#d8bd73;background:#111;font-size:12px;margin-bottom:12px}
@media(max-width:650px){.wrap{padding:10px}.row,.cardgrid{grid-template-columns:1fr}.certificate{width:100%;min-height:auto;padding:18px;border-width:5px}.certtitle{font-size:21px}.meta{grid-template-columns:1fr}.ctable{font-size:9px}.ctable th,.ctable td{padding:5px}.certfooter{gap:8px}.btn{padding:11px 12px}.signature{height:170px}}
@media print{body{background:#fff!important}.wrap>*:not(#certificateArea),.certbuttons{display:none!important}.certwrap{margin:0!important}.certificate{display:block!important;width:190mm!important;min-height:277mm!important;height:277mm!important;margin:0 auto!important;padding:8mm!important;border-width:5px!important;box-shadow:none!important;transform:none!important}.certificate:before{inset:5mm!important}.certhead{padding:5px 15px 9px}.certlogo{font-size:38px}.certtitle{font-size:24px}.meta{margin:9px 0}.meta div{padding:5px}.certintro{margin:8px 5px;line-height:1.7}.ctable{margin:8px 0}.ctable th,.ctable td{padding:6px}.certfooter{margin-top:12px} @page{size:A4;margin:0}}
</style></head><body><div class="wrap">
<div class="brand">PARSGUARD</div><div class="sub">سامانه نمونه مدیریت سبد و گواهی سرمایه‌گذاری</div>

<div class="steps" id="steps"><div class="step on">۱ انتخاب</div><div class="step">۲ اطلاعات</div><div class="step">۳ تأیید</div><div class="step">۴ مدیریت سبد</div><div class="step">۵ امضا</div><div class="step">۶ گواهی</div></div>

<div class="box" id="app"></div>
<div id="certificateArea" class="hidden"></div>
</div>

<script>
const $=x=>document.getElementById(x);
let S={step:1,type:"",name:"",national:"",phone:"",amount:0,alloc:{},history:[],sig:false,issueDate:"",issueTime:"",letter:""};
const metals={gold:{fa:"طلا",en:"Gold",sym:"Au",price:24000000},silver:{fa:"نقره",en:"Silver",sym:"Ag",price:490000},copper:{fa:"مس",en:"Copper",sym:"Cu",price:2148}};
const stocks={dairy:{fa:"دامداری",price:15000},bank:{fa:"بانکی",price:23000},tourism:{fa:"گردشگری",price:20000},agri:{fa:"کشت و صنعت",price:30000}};
function nd(x){return String(x||"").replace(/[۰-۹]/g,d=>"۰۱۲۳۴۵۶۷۸۹".indexOf(d)).replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d))}
function money(x){return Number(x||0).toLocaleString("fa-IR")}
function now(){let d=new Date();S.issueDate=d.toLocaleDateString("fa-IR");S.issueTime=d.toLocaleTimeString("fa-IR",{hour:"2-digit",minute:"2-digit"});if(!S.letter)S.letter="PG-"+d.getFullYear()+"-"+Math.floor(10000+Math.random()*90000)}
function setStep(n){S.step=n;render()}
function render(){
document.querySelectorAll(".step").forEach((x,i)=>x.classList.toggle("on",i<S.step));
let a=$("app");a.classList.remove("hidden");$("certificateArea").classList.add("hidden");
if(S.step==1)a.innerHTML=`<div class="notice">سبد سرمایه‌گذاری مورد نظر خود را انتخاب کنید.</div><div class="cardgrid"><div class="choice ${S.type=="metal"?"sel":""}" onclick="choose('metal')"><div class="ico">🥇⚪🟠</div><b>سبد فلزات</b><small>GOLD • SILVER • COPPER</small></div><div class="choice ${S.type=="stock"?"sel":""}" onclick="choose('stock')"><div class="ico">🦅</div><b>سبد سهام بورسی</b><small>DAIRY • BANK • TOURISM • AGRI</small></div></div>`;
if(S.step==2)a.innerHTML=`<h3>اطلاعات سرمایه‌گذار</h3><div class="row"><div class="field"><label>نام و نام خانوادگی</label><input id="name" value="${S.name}"></div><div class="field"><label>کد ملی</label><input id="national" inputmode="numeric" maxlength="10" value="${S.national}"></div><div class="field"><label>شماره همراه</label><input id="phone" inputmode="numeric" maxlength="11" value="${S.phone}"></div><div class="field"><label>مبلغ سرمایه‌گذاری (تومان)</label><input id="amount" inputmode="numeric" value="${money(S.amount).replace(/٬/g,"")}"></div></div><div class="btns"><button class="btn back" onclick="back()">بازگشت</button><button class="btn next" onclick="infoNext()">ادامه</button></div>`;
if(S.step==3)a.innerHTML=`<h3>تأیید اطلاعات</h3><div class="summary">نام: ${S.name}<br>کد ملی: ${S.national}<br>تلفن: ${S.phone}<br>مبلغ: ${money(S.amount)} تومان<br>نوع سبد: ${S.type=="metal"?"فلزات":"سهام بورسی"}</div><div class="btns"><button class="btn back" onclick="back()">بازگشت</button><button class="btn next" onclick="setStep(4)">تأیید و مدیریت سبد</button></div>`;
if(S.step==4){let ob=S.type=="metal"?metals:stocks;let keys=Object.keys(ob);if(!Object.keys(S.alloc).length)keys.forEach((k,i)=>S.alloc[k]=S.type=="metal"?[40,35,25][i]:25);a.innerHTML=`<h3>مدیریت درصدهای سبد</h3>${keys.map(k=>`<div class="alloc"><span>${ob[k].fa}</span><input id="p_${k}" type="number" min="0" max="100" value="${S.alloc[k]}">%</div>`).join("")}<div class="total" id="tot">جمع: 100%</div><div class="transfer"><b>انتقال داخلی درصد</b><div class="row"><div class="field"><label>از</label><select id="from">${keys.map(k=>`<option value="${k}">${ob[k].fa}</option>`).join("")}</select></div><div class="field"><label>به</label><select id="to">${keys.map(k=>`<option value="${k}">${ob[k].fa}</option>`).join("")}</select></div></div><div class="field"><label>درصد انتقال</label><input id="tr" type="number" min="0" max="100" value="0"></div><button class="btn back" onclick="transfer()">اجرای انتقال</button><div class="history">${S.history.map(x=>x+"<br>").join("")}</div></div><div class="btns"><button class="btn back" onclick="back()">بازگشت</button><button class="btn next" onclick="allocNext()">ذخیره درصدها و ادامه</button></div>`}
if(S.step==5)a.innerHTML=`<h3>امضای دیجیتال مشتری</h3><p style="color:#aaa;font-size:12px">لطفاً داخل کادر زیر امضای خود را رسم کنید.</p><div class="sigbox"><canvas id="sig" class="signature"></canvas></div><div class="btns"><button class="btn back" onclick="back()">بازگشت</button><button class="btn danger" onclick="clearSig()">پاک کردن امضا</button><button class="btn next" onclick="issue()">تأیید امضا و صدور گواهی</button></div>`;
if(S.step==6)showCert();
if(S.step==5)initCanvas();
}
function choose(t){S.type=t;S.alloc={};setStep(2)}
function infoNext(){S.name=$("name").value.trim();S.national=nd($("national").value).replace(/\D/g,"");S.phone=nd($("phone").value).replace(/\D/g,"");S.amount=Number(nd($("amount").value).replace(/\D/g,""));if(!S.name||S.national.length!=10||S.phone.length!=11||!S.phone.startsWith("09")||!S.amount)return alert("اطلاعات را صحیح و کامل وارد کنید.");setStep(3)}
function allocNext(){let ob=S.type=="metal"?metals:stocks;Object.keys(ob).forEach(k=>S.alloc[k]=Number($("p_"+k).value)||0);let t=Object.values(S.alloc).reduce((a,b)=>a+b,0);if(t!=100)return alert("جمع درصدها باید دقیقاً ۱۰۰٪ باشد.");setStep(5)}
function transfer(){let f=$("from").value,t=$("to").value,n=Number($("tr").value)||0;if(f==t||n<=0)return alert("مبدأ و مقصد را درست انتخاب کنید.");if(S.alloc[f]<n)return alert("درصد مبدأ کافی نیست.");S.alloc[f]-=n;S.alloc[t]+=n;let d=new Date(),ds=d.toLocaleDateString("fa-IR"),ts=d.toLocaleTimeString("fa-IR",{hour:"2-digit",minute:"2-digit"}),ob=S.type=="metal"?metals:stocks;S.history.push(`در تاریخ ${ds} و ساعت ${ts}، ${n}% ${ob[f].fa} به ${ob[t].fa} تبدیل شد.`);render()}
function initCanvas(){let c=$("sig"),ctx=c.getContext("2d"),r=c.getBoundingClientRect(),d=devicePixelRatio||1;c.width=r.width*d;c.height=r.height*d;ctx.scale(d,d);ctx.lineWidth=2.2;ctx.lineCap="round";let down=false;c.onpointerdown=e=>{down=true;ctx.beginPath();ctx.moveTo(e.offsetX,e.offsetY)};c.onpointermove=e=>{if(down){ctx.lineTo(e.offsetX,e.offsetY);ctx.stroke();S.sig=true}};c.onpointerup=()=>down=false}
function clearSig(){S.sig=false;render()}
function issue(){if(!S.sig)return alert("ابتدا امضای دیجیتال خود را ثبت کنید.");now();setStep(6)}
function back(){if(S.step>1)setStep(S.step-1)}
function showCert(){let ob=S.type=="metal"?metals:stocks,keys=Object.keys(ob),isM=S.type=="metal";$("app").classList.add("hidden");let rows=keys.map(k=>{let p=S.alloc[k]||0,v=S.amount*p/100,q=isM?v/ob[k].price:v/ob[k].price;return `<tr><td>${ob[k].fa}</td><td>${isM?ob[k].en:"سهام"}</td><td>${isM?ob[k].sym:"—"}</td><td>${p}%</td><td>${money(v)} تومان</td><td>${isM?q.toFixed(4)+" گرم":money(Math.floor(q))+" سهم"}</td></tr>`}).join("");$("certificateArea").classList.remove("hidden");$("certificateArea").innerHTML=`<div class="certwrap"><div class="certificate ${isM?"":"stockcert"}">${isM?'<div class="certhead"><div class="mine">⛏️⛰️</div>':'<div class="certhead"><div class="eagle">🦅</div>'}<div class="certtitle">${isM?"گواهی رسمی سرمایه‌گذاری فلزات":"OFFICIAL SHARE INVESTMENT CERTIFICATE"}</div><div class="certsub">PARSGUARD | سامانه نمونه مدیریت سبد و گواهی سرمایه‌گذاری</div></div><div class="meta"><div>شماره نامه<br><b class="letter">${S.letter}</b></div><div>تاریخ صدور<br><b>${S.issueDate}</b></div><div>ساعت صدور<br><b>${S.issueTime}</b></div></div><div class="certintro">بدین‌وسیله گواهی می‌شود <b>${S.name}</b> با کد ملی <b>${S.national}</b> و شماره همراه <b>${S.phone}</b> مبلغ <b>${money(S.amount)} تومان</b> را در ${isM?"سبد فلزات":"سبد سهام بورسی"} PARSGUARD مطابق ترکیب ثبت‌شده زیر اختصاص داده است.</div><table class="ctable"><thead><tr><th>دارایی</th><th>عنوان</th><th>نماد</th><th>درصد</th><th>ارزش</th><th>مقدار تقریبی</th></tr></thead><tbody>${rows}</tbody></table>${S.history.length?`<div style="border:1px solid #b9a675;padding:9px;font-size:11px;line-height:1.9"><b>سوابق مدیریت سبد:</b><br>${S.history.join("<br>")}</div>`:""}<div class="certfooter"><div><b>امضای دیجیتال مشتری</b><div class="signline"></div><small>ثبت شده در سامانه PARSGUARD</small></div><div><b>نماینده شرکت</b><div class="rep">Parsa Karami</div><div class="seal">PARSGUARD<br>OFFICIAL</div></div></div></div></div><div class="certbuttons"><button class="btn back" onclick="setStep(5)">بازگشت به امضا</button><button class="btn back" onclick="setStep(4)">تغییر سبد / درصدها</button><button class="btn next" onclick="window.print()">چاپ گواهی</button></div>`}
render();
</script></body></html>
