<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>پارسا کرمی | مرکز حقوقی و خدمات</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:Tahoma,Arial,sans-serif;
    background:
    radial-gradient(circle at top right,#183b5b 0%,#071421 40%,#030a11 100%);
    color:#fff;
    min-height:100vh;
    line-height:1.8;
}

header{
    position:sticky;
    top:0;
    z-index:1000;
    background:rgba(3,10,17,.90);
    backdrop-filter:blur(18px);
    border-bottom:1px solid rgba(255,215,0,.15);
    box-shadow:0 10px 35px rgba(0,0,0,.30);
}

.header-inner{
    max-width:1250px;
    margin:auto;
    min-height:82px;
    padding:12px 25px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
    flex-wrap:wrap;
}

.logo{
    display:flex;
    align-items:center;
    gap:12px;
    cursor:pointer;
}

.logo-icon{
    width:48px;
    height:48px;
    border-radius:15px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(135deg,#ffd700,#a87500);
    color:#111;
    font-size:25px;
    box-shadow:0 8px 25px rgba(255,215,0,.20);
}

.logo-text{
    font-size:18px;
    font-weight:bold;
    color:#ffd700;
}

.logo-sub{
    display:block;
    color:#aaa;
    font-size:11px;
}

.nav{
    display:flex;
    align-items:center;
    gap:7px;
    flex-wrap:wrap;
}

.nav button{
    border:1px solid rgba(255,255,255,.08);
    background:rgba(255,255,255,.045);
    color:#ddd;
    padding:9px 13px;
    border-radius:12px;
    cursor:pointer;
    transition:.25s;
    font-size:13px;
}

.nav button:hover,
.nav button.active{
    background:linear-gradient(135deg,#ffd700,#bd8d00);
    color:#111;
    border-color:#ffd700;
    font-weight:bold;
    transform:translateY(-2px);
}

.menu-btn{
    display:none;
    border:0;
    background:rgba(255,255,255,.08);
    color:#ffd700;
    width:45px;
    height:45px;
    border-radius:13px;
    font-size:23px;
    cursor:pointer;
}

.hero{
    max-width:1200px;
    margin:auto;
    padding:85px 25px 55px;
    text-align:center;
}

.hero-badge{
    display:inline-block;
    padding:7px 15px;
    border-radius:30px;
    background:rgba(255,215,0,.08);
    border:1px solid rgba(255,215,0,.25);
    color:#ffd700;
    font-size:13px;
    margin-bottom:20px;
}

.hero h1{
    font-size:clamp(30px,5vw,55px);
    line-height:1.35;
    margin-bottom:18px;
    background:linear-gradient(90deg,#fff,#ffd700);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

.hero p{
    max-width:780px;
    margin:auto;
    color:#bfc8d1;
    font-size:16px;
}

.gold-btn{
    border:0;
    cursor:pointer;
    padding:13px 23px;
    border-radius:13px;
    background:linear-gradient(135deg,#ffd700,#bd8d00);
    color:#111;
    font-weight:bold;
    margin-top:22px;
    transition:.25s;
    box-shadow:0 10px 25px rgba(255,215,0,.13);
}

.gold-btn:hover{
    transform:translateY(-3px);
    box-shadow:0 15px 30px rgba(255,215,0,.22);
}

.welcome-box{
    display:none;
    max-width:650px;
    margin:30px auto 0;
    padding:25px;
    border-radius:22px;
    background:linear-gradient(135deg,rgba(255,215,0,.10),rgba(255,255,255,.04));
    border:1px solid rgba(255,215,0,.25);
    animation:appear .5s ease;
}

.welcome-heart{
    font-size:48px;
    animation:heart 1.2s infinite;
}

.welcome-box h2{
    color:#ffd700;
}

.container{
    width:min(1150px,92%);
    margin:auto;
}

.section{
    display:none;
    padding:35px 0 65px;
    animation:appear .4s ease;
}

.section.active{
    display:block;
}

.section-title{
    text-align:center;
    margin-bottom:32px;
}

.section-title span{
    display:block;
    color:#ffd700;
    font-size:12px;
    margin-bottom:5px;
    letter-spacing:1px;
}

.section-title h2{
    font-size:29px;
}

.section-title p{
    color:#9da8b3;
    font-size:14px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
    gap:18px;
}

.card{
    position:relative;
    overflow:hidden;
    background:linear-gradient(145deg,rgba(255,255,255,.075),rgba(255,255,255,.025));
    border:1px solid rgba(255,255,255,.08);
    border-radius:22px;
    padding:25px;
    transition:.3s;
    box-shadow:0 15px 35px rgba(0,0,0,.16);
}

.card:hover{
    transform:translateY(-6px);
    border-color:rgba(255,215,0,.35);
}

.card-icon{
    width:52px;
    height:52px;
    border-radius:16px;
    background:rgba(255,215,0,.10);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:25px;
    margin-bottom:15px;
}

.card h3{
    color:#ffd700;
    margin-bottom:8px;
}

.card p{
    color:#b9c2cb;
    font-size:14px;
}

.lawyer-card{
    max-width:760px;
    margin:auto;
    text-align:center;
    padding:40px 30px;
}

.lawyer-avatar{
    width:105px;
    height:105px;
    border-radius:50%;
    margin:0 auto 20px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(135deg,#ffd700,#956d00);
    color:#111;
    font-size:45px;
    border:5px solid rgba(255,215,0,.12);
}

.lawyer-name{
    font-size:30px;
}

.lawyer-title{
    color:#ffd700;
}

.info-list{
    display:grid;
    gap:10px;
    margin-top:20px;
}

.info-row{
    background:rgba(255,255,255,.045);
    border:1px solid rgba(255,255,255,.06);
    padding:13px;
    border-radius:13px;
    color:#cbd3da;
}

.info-row strong{
    color:#fff;
}

.notice{
    background:rgba(255,215,0,.06);
    border-right:4px solid #ffd700;
    border-radius:12px;
    padding:14px 18px;
    color:#c5ced6;
    font-size:13px;
    margin-bottom:20px;
}

.search-box{
    margin-bottom:25px;
}

.search-box input{
    width:100%;
    padding:16px;
    border-radius:15px;
    border:1px solid rgba(255,255,255,.12);
    background:#101f2d;
    color:#fff;
    outline:none;
    font-size:15px;
}

.search-box input:focus{
    border-color:#ffd700;
}

.category-bar{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    margin-bottom:20px;
}

.category-bar button{
    background:rgba(255,255,255,.05);
    color:#ccc;
    border:1px solid rgba(255,255,255,.08);
    border-radius:12px;
    padding:9px 14px;
    cursor:pointer;
}

.category-bar button.active{
    background:#ffd700;
    color:#111;
}

.law-card{
    margin-bottom:12px;
    padding:0;
}

.law-head{
    padding:18px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.law-head strong{
    color:#ffd700;
}

.law-body{
    display:none;
    padding:0 18px 18px;
    color:#bdc6cf;
    border-top:1px solid rgba(255,255,255,.05);
}

.law-body.open{
    display:block;
}

.law-number{
    color:#ffd700;
    font-size:12px;
}

.tip-number{
    width:35px;
    height:35px;
    border-radius:50%;
    background:rgba(255,215,0,.12);
    color:#ffd700;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:bold;
    margin-bottom:12px;
}

.quiz{
    margin-bottom:20px;
    padding:25px;
    border-radius:20px;
    background:rgba(255,255,255,.045);
    border:1px solid rgba(255,255,255,.08);
}

.quiz h3{
    color:#ffd700;
    margin-bottom:10px;
}

.option{
    display:block;
    margin:9px 0;
    padding:12px;
    background:rgba(255,255,255,.035);
    border-radius:11px;
    cursor:pointer;
    color:#ccc;
}

.result{
    margin-top:13px;
    font-weight:bold;
}

input,
select{
    width:100%;
    padding:13px;
    margin:7px 0;
    border-radius:12px;
    border:1px solid rgba(255,255,255,.12);
    background:#101f2d;
    color:#fff;
    outline:none;
}

.price{
    font-size:23px;
    color:#ffd700;
    font-weight:bold;
}

.about-box,
.contact-box{
    max-width:800px;
    margin:auto;
    text-align:center;
}

.about-avatar{
    width:100px;
    height:100px;
    margin:auto;
    border-radius:50%;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#ffd700,#8f6800);
    color:#111;
    font-size:40px;
    font-weight:bold;
}

.about-name{
    color:#ffd700;
    font-size:28px;
    margin:15px 0 3px;
}

.contact-number{
    font-size:22px;
    color:#ffd700;
    direction:ltr;
    display:inline-block;
}

footer{
    margin-top:40px;
    padding:35px 20px;
    text-align:center;
    background:rgba(0,0,0,.35);
    border-top:1px solid rgba(255,255,255,.06);
    color:#8f99a3;
