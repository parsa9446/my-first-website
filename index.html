</style></head><body><div class="wrap"><div class="head"><div class="logo">PARSGUARD</div><div class="tag">⚖️ سامانه مدیریت و صدور قراردادهای سرمایه‌گذاری</div></div><div class="card"><div class="title">انتخاب نوع قرارداد</div><div class="types"><div class="type active" id="metalType"><div class="typeicon">🥇</div><div class="typename">سبد فلزات</div><div class="typedesc">طلا • نقره • مس</div></div><div class="type" id="stockType"><div class="typeicon">📈</div><div class="typename">سبد سهام</div><div class="typedesc">سرمایه‌گذاری ترکیبی</div></div></div></div><div class="card"><div class="title">اطلاعات مشتری</div><div class="grid"><div><label>نام و نام خانوادگی</label><input id="name" autocomplete="off"></div><div><label>کد ملی</label><input id="national" inputmode="numeric" maxlength="10"></div><div><label>شماره تلفن</label><input id="phone" inputmode="numeric" maxlength="11"></div><div><label>مدت قرارداد</label><select id="duration"><option value="3">۳ ماهه</option><option value="6">۶ ماهه</option><option value="12">۱۲ ماهه</option><option value="24">۲۴ ماهه</option><option value="36">۳۶ ماهه</option><option value="60">۶۰ ماهه</option></select></div><div><label>مبلغ سرمایه‌گذاری (تومان)</label><input id="amount" inputmode="numeric"></div></div><div class="title" style="margin-top:20px">تخصیص سرمایه</div><div class="alloc" id="alloc"></div><div class="total" id="total">مجموع: 100%</div><div class="warning">⚠️ این سامانه صرفاً یک نمونه نمایشی و آزمایشی برای صدور قرارداد است و به‌منزله ارائه خدمات مالی واقعی نیست.</div><button class="btn" id="preview">ادامه → ثبت امضای دیجیتال</button></div><div id="result" class="result"></div></div><script>
const $=id=>document.getElementById(id);let isMetal=true,draft=null,contracts=[];try{contracts=JSON.parse(localStorage.getItem("PG_CONTRACTS")||"[]");if(!Array.isArray(contracts))contracts=[]}catch(e){contracts=[]}function norm(v){return String(v).replace(/[۰-۹]/g,d=>"۰۱۲۳۴۵۶۷۸۹".indexOf(d)).replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d))}$("national").oninput=e=>e.target.value=norm(e.target.value).replace(/\D/g,"").slice(0,10);$("phone").oninput=e=>{let v=norm(e.target.value).replace(/\D/g,"");if(v&&!v.startsWith("0"))v="0"+v;e.target.value=v.slice(0,11)};$("amount").oninput=e=>e.target.value=norm(e.target.value).replace(/\D/g,"");function setAlloc(){$("alloc").innerHTML=isMetal?'<div>🥇 طلا<input id="gold" value="40"></div><div>🥈 نقره<input id="silver" value="35"></div><div>🪙 مس<input id="copper" value="25"></div>':'<div>🐄 دامداری<input id="gold" value="25"></div><div>🏦 بانک<input id="silver" value="25"></div><div>🌍 گردشگری تکاب<input id="copper" value="25"></div><div>🌾 کشت و صنعت<input id="farm" value="25"></div>';["gold","silver","copper","farm"].forEach(x=>{if($(x))$(x).oninput=()=>{$(x).value=norm($(x).value).replace(/\D/g,"").slice(0,3);update()}});update()}function update(){let s=["gold","silver","copper","farm"].reduce((a,x)=>a+($(x)?Number($(x).value)||0:0),0);$("total").textContent="مجموع: "+s+"%";$("total").style.color=s===100?"#d8af4a":"#e66"}$("metalType").onclick=()=>{isMetal=true;$("metalType").classList.add("active");$("stockType").classList.remove("active");setAlloc()};$("stockType").onclick=()=>{isMetal=false;$("stockType").classList.add("active");$("metalType").classList.remove("active");setAlloc()};function fmt(d){return new Intl.DateTimeFormat("fa-IR",{year:"numeric",month:"long",day:"numeric"}).format(d)+" | "+new Intl.DateTimeFormat("en-US",{year:"numeric",month:"long",day:"numeric"}).format(d)}function tm(d){return d.toLocaleTimeString("fa-IR",{hour:"2-digit",minute:"2-digit",second:"2-digit"})}function money(n){return Number(n).toLocaleString("fa-IR")}function getAlloc(){let ids=isMetal?[["طلا","Au","Aurum","gold"],["نقره","Ag","Argentum","silver"],["مس","Cu","Cuprum","copper"]]:[["دامداری","","",""],["بانک","","",""],["گردشگری تکاب","","",""],["کشت و صنعت","","",""]],keys=["gold","silver","copper","farm"];return ids.map((x,i)=>({name:x[0],symbol:x[1]||"",scientific:x[2]||"",cls:x[3]||"",p:Number($(keys[i])?.value)||0}))}function validate(){let n=$("name").value.trim(),nat=norm($("national").value).replace(/\D/g,"").slice(0,10),ph=norm($("phone").value).replace(/\D/g,"").slice(0,11),a=norm($("amount").value).replace(/\D/g,"");$("national").value=nat;$("phone").value=ph;$("amount").value=a;if(!n||nat.length!==10||!a)return alert("نام، کد ملی ۱۰ رقمی و مبلغ را کامل وارد کنید."),null;if(!/^09\d{9}$/.test(ph))return alert("شماره تماس باید ۱۱ رقم و با 09 شروع شود."),null;let al=getAlloc(),sum=al.reduce((z,x)=>z+x.p,0);return sum!==100?(alert("مجموع درصدها باید دقیقاً 100% باشد."),null):{name:n,national:nat,phone:ph,amount:Number(a),duration:Number($("duration").value),type:isMetal?"metal":"stock",alloc:al}}function signature(){$("result").innerHTML='<div class="signaturebox"><h2>🔐 ثبت امضای دیجیتال</h2><p>اطلاعات را بررسی کنید و امضای خود را داخل کادر رسم کنید.</p><canvas id="sigcanvas" class="sigcanvas"></canvas><div class="sigstatus" id="sigstatus">هنوز امضایی ثبت نشده است</div><button class="btn clearbtn" id="clear">پاک کردن امضا</button><button class="btn" id="issue" disabled>🔐 تأیید امضا و نمایش گواهی</button></div>';let c=$("sigcanvas"),ctx=c.getContext("2d"),drawing=false,has=false,d=window.devicePixelRatio||1,r=c.getBoundingClientRect();c.width=r.width*d;c.height=r.height*d;ctx.scale(d,d);ctx.lineWidth=2.4;ctx.lineCap="round";ctx.lineJoin="round";ctx.strokeStyle="#111";let pos=e=>{let q=c.getBoundingClientRect();return{x:e.clientX-q.left,y:e.clientY-q.top}};c.onpointerdown=e=>{e.preventDefault();drawing=has=true;let p=pos(e);ctx.beginPath();ctx.moveTo(p.x,p.y);$("sigstatus").textContent="امضا ثبت شد ✓";$("issue").disabled=false;c.setPointerCapture?.(e.pointerId)};c.onpointermove=e=>{if(drawing){e.preventDefault();let p=pos(e);ctx.lineTo(p.x,p.y);ctx.stroke()}};c.onpointerup=e=>{drawing=false;c.releasePointerCapture?.(e.pointerId)};c.onpointercancel=()=>drawing=false;$("clear").onclick=()=>{ctx.clearRect(0,0,c.width/d,c.height/d);has=false;$("issue").disabled=true;$("sigstatus").textContent="هنوز امضایی ثبت نشده است"};$("issue").onclick=()=>{if(!has)return alert("لطفاً ابتدا امضا کنید.");draft.signature=c.toDataURL("image/png");finalIssue()}}function finalIssue(){if(!draft?.signature)return alert("امضای دیجیتال ثبت نشده است.");let now=new Date(),end=new Date(now);end.setMonth(end.getMonth()+draft.duration);draft.issued=fmt(now);draft.time=tm(now);draft.expiry=fmt(end);draft.letter="PG/"+(draft.type==="metal"?"M":"S")+"/"+now.getFullYear()+"/"+Math.floor(100000+Math.random()*900000);draft.contract="PG-"+(draft.type==="metal"?"M":"S")+"-"+Math.floor(100000+Math.random()*900000);contracts.push({...draft});try{localStorage.setItem("PG_CONTRACTS",JSON.stringify(contracts))}catch(e){}let x={...draft};draft=null;render(x)}function esc(v){return String(v).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;")}function render(c){let a=c.alloc||[],rows=`<div class="row"><span>نام و نام خانوادگی</span><b>${esc(c.name)}</b></div><div class="row"><span>کد ملی</span><b>${esc(c.national)}</b></div><div class="row"><span>شماره تماس</span><b>${esc(c.phone)}</b></div><div class="row"><span>مدت قرارداد</span><b>${c.duration} ماه</b></div><div class="row"><span>تاریخ صدور</span><b>${esc(c.issued)}</b></div><div class="row"><span>تاریخ اعتبار</span><b>${esc(c.expiry)}</b></div><div class="row"><span>مبلغ سرمایه‌گذاری</span><b>${money(c.amount)} تومان</b></div>`,head=c.type==="metal"?`<div class="emblem"><div class="mine"><div class="mount"></div><div class="tunnel"></div><div class="minepick">⛏️</div><div class="mineword">MINING • </script></body></html>
