<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>سایت پارسا</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: Tahoma, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;

            background: linear-gradient(
                135deg,
                #0f2027,
                #203a43,
                #2c5364,
                #6a11cb,
                #2575fc
            );

            background-size: 400% 400%;
            animation: backgroundMove 12s ease infinite;
        }

        @keyframes backgroundMove {
            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }

        .circle {
            position: absolute;
            border-radius: 50%;
            filter: blur(3px);
            opacity: 0.35;
            animation: float 8s infinite ease-in-out;
        }

        .circle.one {
            width: 220px;
            height: 220px;
            background: #00f2fe;
            top: 5%;
            left: 5%;
        }

        .circle.two {
            width: 180px;
            height: 180px;
            background: #ff00cc;
            bottom: 5%;
            right: 5%;
            animation-delay: 2s;
        }

        .circle.three {
            width: 120px;
            height: 120px;
            background: #ffff00;
            bottom: 20%;
            left: 15%;
            animation-delay: 4s;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0) translateX(0);
            }

            50% {
                transform: translateY(-35px) translateX(20px);
            }
        }

        .card {
            position: relative;
            z-index: 2;

            width: 90%;
            max-width: 600px;

            padding: 55px 35px;

            text-align: center;

            background: rgba(255, 255, 255, 0.14);
            border: 1px solid rgba(255, 255, 255, 0.3);

            border-radius: 30px;

            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);

            box-shadow:
                0 25px 60px rgba(0, 0, 0, 0.35);

            color: white;

            animation: cardAppear 1.2s ease;
        }

        @keyframes cardAppear {
            from {
                opacity: 0;
                transform: translateY(40px) scale(0.9);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .emoji {
            font-size: 65px;
            margin-bottom: 20px;

            animation: wave 2s infinite;
        }

        @keyframes wave {
            0%, 100% {
                transform: rotate(0deg);
            }

            25% {
                transform: rotate(12deg);
            }

            75% {
                transform: rotate(-12deg);
            }
        }

        h1 {
            font-size: 42px;
            margin-bottom: 15px;

            text-shadow:
                0 4px 15px rgba(0, 0, 0, 0.3);
        }

        h2 {
            font-size: 22px;
            font-weight: normal;
            margin-bottom: 20px;
        }

        p {
            font-size: 17px;
            line-height: 2;
            opacity: 0.9;
            margin-bottom: 25px;
        }

        .clock {
            display: inline-block;

            padding: 10px 20px;

            margin-bottom: 25px;

            border-radius: 50px;

            background: rgba(255, 255, 255, 0.15);

            font-size: 18px;
        }

        button {
            border: none;
            outline: none;

            padding: 15px 35px;

            border-radius: 50px;

            background: white;
            color: #333;

            font-size: 17px;
            font-weight: bold;

            cursor: pointer;

            box-shadow:
                0 10px 25px rgba(0, 0, 0, 0.25);

            transition: 0.3s;
        }

        button:hover {
            transform: translateY(-5px) scale(1.05);

            box-shadow:
                0 15px 30px rgba(0, 0, 0, 0.35);
        }

        button:active {
            transform: scale(0.95);
        }

        #message {
            margin-top: 20px;
            font-size: 18px;
            font-weight: bold;
            min-height: 30px;
        }

        .footer {
            margin-top: 30px;
            font-size: 13px;
            opacity: 0.7;
        }

        @media (max-width: 500px) {
            .card {
                padding: 40px 20px;
            }

            h1 {
                font-size: 32px;
            }

            h2 {
                font-size: 19px;
            }

            p {
                font-size: 15px;
            }

            .emoji {
                font-size: 50px;
            }
        }
    </style>
</head>

<body>

    <div class="circle one"></div>
    <div class="circle two"></div>
    <div class="circle three"></div>

    <div class="card">

        <div class="emoji">👋</div>

        <h1>سلام!</h1>

        <h2>به اولین سایت پارسا خوش آمدید 🚀</h2>

        <p>
            این سایت رو خودم ساختم و تازه اول راهه!
            <br>
            قراره هر روز جذاب‌تر و حرفه‌ای‌ترش کنم 😎
        </p>

        <div class="clock" id="clock">
            ساعت: در حال بارگذاری...
        </div>

        <br>

        <button onclick="showMessage()">
            ✨ کلیک کن!
        </button>

        <div id="message"></div>

        <div class="footer">
            ساخته شده با ❤️ و کمی کدنویسی
        </div>

    </div>

    <script>
        function updateClock() {
            const now = new Date();

            const time =
                now.getHours().toString().padStart(2, "0")
                + ":"
                +
                now.getMinutes().toString().padStart(2, "0")
                + ":"
                +
                now.getSeconds().toString().padStart(2, "0");

            document.getElementById("clock").innerText =
                "🕐 ساعت: " + time;
        }

        setInterval(updateClock, 1000);

        updateClock();

        function showMessage() {
            document.getElementById("message").innerText =
                "🎉 آفرین! سایتت زنده‌ست 😎🔥";
        }
    </script>

</body>
</html>
