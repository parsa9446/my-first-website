.buttons{

.btn{

    padding:8px;

    font-size:13px;
    border:0;
    cursor:pointer;

.map{

    color:white;
}

.info{
    background:#eee;
    color:#333;
}

.panel{
    background:white;
    margin-top:40px;

    border-radius:18px;

}

.panel h2{

}

.fal{
    text-align:center;
}

.fal button{
    background:#d49b28;
    color:white;
    border:0;

    border-radius:10px;
    cursor:pointer;
    font-size:15px;
}

.result{

    padding:18px;
    background:#fff8e6;
    border-radius:12px;
    display:none;
}

.poem{
    text-align:center;
    font-size:18px;
    color:#555;
}

footer{

    color:white;
    text-align:center;
    padding:25px;
    font-size:13px;

@media(max-width:600px){

function imageUrl(name){

    return "https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=700&q=70";

}


function showPlaces(filter="all", search=""){

    const box=document.getElementById("places");

    let list=places.filter(p=>{

        const cityOK=filter==="all" || p[0]===filter;

        const text=(p[1]+" "+p[2]).toLowerCase();

        const searchOK=!search || text.includes(search.toLowerCase());

        return cityOK && searchOK;

    });

    let html="";

    const cities=["شیراز","اصفهان","کرمانشاه"];

    cities.forEach(city=>{

        const cityPlaces=list.filter(p=>p[0]===city);

        if(!cityPlaces.length) return;

        html+=`
        <h2 class="city-title">
            ${city==="شیراز"?"🌹":city==="اصفهان"?"🏛️":"⛰️"}
            ${city}
        </h2>

        <div class="grid">
        `;

        cityPlaces.forEach(p=>{

            const map=
            "https://www.google.com/maps/search/?api=1&query="
            +encodeURIComponent(p[1]+" "+p[0]);

            html+=`

            <article class="card">

                <img
                src="${imageUrl(p[3])}"
                loading="lazy"
                alt="${p[1]}">

                <div class="card-body">

                    <h3>📍 ${p[1]}</h3>

                    <p>${p[2]}</p>

                    <div class="buttons">

                        <a
                        class="btn map"
                        href="${map}"
                        target="_blank">
                        🗺️ نقشه
                        </a>

                        <button
                        class="btn info"
                        onclick="showInfo('${p[1]}','${p[2]}')">
                        ℹ️ اطلاعات
                        </button>

                    </div>

                </div>

            </article>

            `;

        });

        html+=`</div>`;

    });

    if(!html){

        html=`
        <div class="panel" style="text-align:center">
        😕 جاذبه‌ای پیدا نشد.
        </div>
        `;

    }

    box.innerHTML=html;

}


/* =========================
   فیلتر شهر
========================= */

let currentCity="all";

function showCity(city,btn){

    currentCity=city;

    document.querySelectorAll("nav button")
    .forEach(b=>b.classList.remove("active"));

    btn.classList.add("active");

    document.getElementById("search").value="";

    showPlaces(city);

}


/* =========================
   جستجو
========================= */

function searchPlaces(){

    const value=document.getElementById("search").value;

    showPlaces(currentCity,value);

}

function showInfo(name,desc){

    alert(

        desc+
        "\n\n"+
        "برای مشاهده موقعیت روی نقشه، دکمه «نقشه» را بزنید."
    );

}
