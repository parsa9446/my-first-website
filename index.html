<!doctype html><html lang="fa" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PARSGUARD | گواهی سرمایه‌گذاری</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#30250b,#0b0b0b 38%,#030303);color:#eee;font-family:tahoma,Arial}.wrap{max-width:1100px;margin:auto;padding:14px}.head,.card,.signaturebox{background:linear-gradient(145deg,#161616,#090909);border:1px solid #80651d;border-radius:18px;padding:17px;margin-top:13px;box-shadow:0 12px 40px #000}.head{text-align:center}.head h1{margin:0;color:#d7ad45;letter-spacing:3px}.head p{color:#aaa}.types{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.type{padding:18px;text-align:center;border:1px solid #594719;border-radius:15px;background:#151515;cursor:pointer;transition:.25s}.type.active,.type:hover{border-color:#d4ad4a;transform:translateY(-2px)}.ico{font-size:40px}.grid,.livegrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}label{display:block;color:#c7a34a;font-size:12px;margin:5px 0}input,select{width:100%;padding:10px;border-radius:9px;border:1px solid #51431e;background:#090909;color:#fff;outline:0}.btn{border:0;border-radius:10px;padding:10px 16px;background:linear-gradient(135deg,#d6ad43,#80601b);color:#111;font-weight:bold;cursor:pointer;margin-top:10px}.price,.row{display:flex;justify-content:space-between;gap:8px;padding:6px;border-bottom:1px dashed #9b8b65}.warn{color:#d9ad42;font-size:11px;margin-top:7px}.total{text-align:center;color:#dcb650;font-weight:bold;margin:7px}.signaturebox canvas{width:100%;height:115px;background:#fff;border-radius:9px;touch-action:none}.hidden{display:none}.certificate{background:#f1e8ce;color:#201a0d;border:8px double #8e6a20;border-radius:5px;padding:15px;margin-top:14px;box-shadow:0 15px 50px #000;position:relative;font-size:10px}.certificate:before{content:"";position:absolute;inset:7px;border:1px solid #b99645;pointer-events:none}.certtop{text-align:center;border-bottom:2px solid #9d7928;padding-bottom:6px}.certtop h2{margin:3px;color:#65490e;font-size:20px}.mineart{font-size:29px;letter-spacing:4px}.metalline{font-size:9px;color:#765517;font-weight:bold;letter-spacing:2px}.meta{display:flex;justify-content:space-between;gap:5px;flex-wrap:wrap;font-size:8px}.rows{margin-top:6px}.metalcards,.stockcards{display:grid;gap:6px;margin-top:6px}.metalcards{grid-template-columns:repeat(3,1fr)}.stockcards{grid-template-columns:repeat(4,1fr)}.mcard,.scard{border:1px solid #a88b4a;background:#f7efd9;padding:6px;text-align:center;border-radius:8px}.mcard b,.scard b{font-size:16px;color:#775915}.scard{border-color:#60798d;background:#edf2f5}.scard b{color:#244866}.scard .sym{font-size:18px;font-weight:bold}.scard small{display:block;margin-top:2px}.livebox{margin:6px 0;padding:7px;border:1px solid #b58d32;border-radius:9px;background:#fff7dc}.livegrid{grid-template-columns:repeat(3,1fr);gap:5px}.livebox label{color:#6b5016;font-size:8px}.livebox input,.livebox select{padding:6px;font-size:9px}.history{margin-top:6px;border-top:1px solid #9d7928;padding-top:5px;font-size:8px}.signs{display:flex;justify-content:space-between;gap:8px;margin-top:8px;text-align:center}.sig{font-family:cursive;font-size:18px}.seal{border:2px solid #8d6722;border-radius:50%;width:58px;height:58px;display:flex;align-items:center;justify-content:center;margin:auto;color:#765517;font-size:7px}.stock{background:#e5ebf0;border-color:#274967}.stock .certtop h2{color:#244866}.small{font-size:8px;color:#777}@media(max-width:700px){.wrap{padding:8px}.head,.card,.signaturebox{padding:12px}.grid,.types{grid-template-columns:1fr}.certificate{padding:9px;font-size:9px}.certtop h2{font-size:17px}.stockcards{grid-template-columns:repeat(2,1fr)}.livegrid{grid-template-columns:1fr}.livebox .btn,.printbtn{width:100%;font-size:13px}.sig{font-size:15px}}@media print{html,body{background:#fff!important;margin:0!important;padding:0!important}.wrap{max-width:none!important;width:100%!important;padding:0!important}.wrap>*:not(#result){display:none!important}#result{display:block!important;width:100%!important;margin:0!important;padding:0!important}.certificate{width:100%!important;height:277mm!important;min-height:277mm!important;max-height:277mm!important;margin:0!important;padding:10mm!important;box-shadow:none!important;overflow:hidden!important}.livebox,.printbtn{display:none!important}.stockcards{grid-template-columns:repeat(4,1fr)!important}@page{size:A4 portrait;margin:4mm}}</style></head><body><div class="wrap"><div class="head"><h1>PARSGUARD</h1><p>⚖️ سامانه مدیریت و صدور گواهی سرمایه‌گذاری</p></div><div class="card"><h3>نوع سبد</h3><div class="types"><div id="metalType" class="type active" onclick="choose(1)"><div class="ico">⛏️</div><b>سبد فلزات</b><br><small>طلا • نقره • مس</small></div><div id="stockType" class="type" onclick="choose(0)"><div class="ico">📊</div><b>سبد سهام بورسی</b><br><small>دامداری • بانکی • گردشگری • کشت و صنعت</small></div></div></div><div class="card"><h3>اطلاعات مشتری</h3><div class="grid"><div><label>نام و نام خانوادگی</label><input id="name"></div><div><label>کد ملی</label><input id="national" maxlength="10" inputmode="numeric"></div><div><label>شماره تلفن</label><input id="phone" maxlength="11" inputmode="numeric" placeholder="09xxxxxxxxx"></div><div><label>مبلغ سرمایه‌گذاری (تومان)</label><input id="amount" inputmode="numeric"></div></div><div id="alloc"></div><div id="prices"></div><div class="warn">⚠️ این سامانه نمونه/آزمایشی است و ارقام آن تضمین معامله واقعی یا بازدهی سرمایه‌گذاری نیستند.</div><button class="btn" onclick="startSign()">✍️ ثبت اطلاعات و ادامه</button></div><div id="signbox" class="signaturebox hidden"><h3>امضای دیجیتال</h3><canvas id="canvas"></canvas><button class="btn" onclick="clearSign()">پاک کردن</button><button class="btn" onclick="issue()">صدور گواهی</button></div><div id="result"></div></div><script>const $=x=>document.getElementById(x),norm=s=>(s||"").replace(/[۰-۹]/g,x=>"۰۱۲۳۴۵۶۷۸۹".indexOf(x)).replace(/[٠-٩]/g,x=>"٠١٢٣٤٥٦٧٨٩".indexOf(x)),money=n=>Number(n||0).toLocaleString("fa-IR")+" تومان",date=d=>new Date(d).toLocaleDateString("fa-IR"),time=d=>new Date(d).toLocaleTimeString("fa-IR",{hour:"2-digit",minute:"2-digit"}),names=k=>({gold:"طلا",silver:"نقره",copper:"مس",damdari:"دامداری",banki:"بانکی",gardeshgari:"گردشگری",kesht:"کشت و صنعت"})[k]||k;let isMetal=1,draft,currentCert,prices={gold:24000000,silver:490000,copper:2500},stocks={damdari:{n:"سهام دامداری",s:"دامداری",p:10000},banki:{n:"سهام بانکی",s:"بانکی",p:23000},gardeshgari:{n:"سهام گردشگری",s:"گردشگری",p:15000},kesht:{n:"سهام کشت و صنعت",s:"کشت و صنعت",p:40000}};function choose(x){isMetal=x;$("metalType").classList.toggle("active",!!x);$("stockType").classList.toggle("active",!x);setAlloc();showPrices()}function setAlloc(){let a=isMetal?{gold:40,silver:35,copper:25}:{damdari:30,banki:25,gardeshgari:25,kesht:20};$("alloc").innerHTML="<h3>ترکیب سبد</h3>"+Object.entries(a).map(([k,v])=>`<label>${isMetal?names(k):stocks[k].s} (%)</label><input class="ap" data-k="${k}" value="${v}" inputmode="numeric">`).join("")+`<div class="total" id="tot">جمع: 100%</div>`;document.querySelectorAll(".ap").forEach(i=>i.oninput=()=>{let t=[...document.querySelectorAll(".ap")].reduce((s,x)=>s+(+norm(x.value)||0),0);$("tot").textContent="جمع: "+t+"%"})}function showPrices(){$("prices").innerHTML=isMetal?`<h3>💰 قیمت‌های فعلی فلزات</h3><div class="price"><span>طلا</span><b>${money(prices.gold)}</b></div><div class="price"><span>نقره</span><b>${money(prices.silver)}</b></div><div class="price"><span>مس</span><b>${money(prices.copper)}</b></div>`:`<h3>📈 ساختار نمونه سبد سهام</h3><div class="price"><span>دامداری</span><b>۱۰,۰۰۰ تومان</b></div><div class="price"><span>بانکی</span><b>۲۳,۰۰۰ تومان</b></div><div class="price"><span>گردشگری</span><b>۱۵,۰۰۰ تومان</b></div><div class="price"><span>کشت و صنعت</span><b>۴۰,۰۰۰ تومان</b></div>`}function valid(){let n=$("name").value.trim(),nid=norm($("national").value).replace(/\D/g,""),ph=norm($("phone").value).replace(/\D/g,""),am=+norm($("amount").value).replace(/\D/g,""),aa={};document.querySelectorAll(".ap").forEach(i=>aa[i.dataset.k]=+norm(i.value)||0);let t=Object.values(aa).reduce((a,b)=>a+b,0);return n&&nid.length==10&&/^09\d{9}$/.test(ph)&&am&&t==100?{name:n,national:nid,phone:ph,amount:am,alloc:aa}:null}function startSign(){draft=valid();if(!draft)return alert("اطلاعات را کامل کنید؛ کد ملی ۱۰ رقم، تلفن ۱۱ رقم با 09 و جمع درصدها دقیقاً 100٪ باشد.");$("signbox").classList.remove("hidden");scrollTo({top:$("signbox").offsetTop,behavior:"smooth"})}let cv=$("canvas"),ctx=cv.getContext("2d"),down=0;function resize(){cv.width=cv.clientWidth*devicePixelRatio;cv.height=cv.clientHeight*devicePixelRatio;ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);ctx.lineWidth=2;ctx.lineCap="round"}resize();onresize=resize;["pointerdown","pointermove","pointerup"].forEach(e=>cv.addEventListener(e,a=>{if(e=="pointerdown"){down=1;ctx.beginPath();ctx.moveTo(a.offsetX,a.offsetY)}if(e=="pointermove"&&down){ctx.lineTo(a.offsetX,a.offsetY);ctx.stroke()}if(e=="pointerup")down=0}));function clearSign(){ctx.clearRect(0,0,cv.clientWidth,cv.clientHeight)}function issue(){let now=new Date();currentCert={...draft,metal:isMetal,issued:now.toISOString(),letter:"PG-"+Math.floor(100000+Math.random()*900000),signature:cv.toDataURL(),history:[]};render(currentCert)}function convert(){let c=currentCert,f=$("cf").value,t=$("ct").value,p=+norm($("cp").value)||0;if(f==t)return alert("مبدأ و مقصد متفاوت باشند.");if(p<=0||p>c.alloc[f])return alert("درصد تبدیل معتبر نیست.");c.alloc[f]-=p;c.alloc[t]+=p;let n=new Date();c.history.push(`در تاریخ ${date(n)} و ساعت ${time(n)}، ${p}% ${isMetal?names(f):stocks[f].s} به ${isMetal?names(t):stocks[t].s} تبدیل شد.`);render(c)}function render(c){let cards=c.metal?Object.entries(c.alloc).map(([k,v])=>{let val=c.amount*v/100,p=prices[k];return`<div class="mcard"><b>${k=="gold"?"Au":k=="silver"?"Ag":"Cu"}</b><div>${names(k)}</div><small>${v}%</small><br><b>${money(val)}</b></div>`}).join(""):Object.entries(c.alloc).map(([k,v])=>{let val=c.amount*v/100,q=Math.floor(val/stocks[k].p);return`<div class="scard"><div class="sym">${stocks[k].s}</div><b>${v}%</b><small>${stocks[k].n}</small><small>ارزش تخصیصی: ${money(val)}</small><small>قیمت مبنا: ${stocks[k].p.toLocaleString("fa-IR")} تومان</small><small>تعداد تقریبی: ${q.toLocaleString("fa-IR")} سهم</small></div>`}).join(""),keys=Object.keys(c.alloc),history=c.history.length?c.history.map(x=>`<div class="row">${x}</div>`).join(""):"<div class=small>تاکنون تغییر داخلی ثبت نشده است.</div>";$("result").innerHTML=`<div class="certificate ${c.metal?"":"stock"}"><div class="certtop"><div class="mineart">${c.metal?"⛏️ ⛰️ 🪙 🥈 🟠":"📊 🏦 🏭 🌾"}</div><div class="metalline">${c.metal?"MINING • GOLD • SILVER • COPPER • PARSGUARD":"IRAN STOCK PORTFOLIO • PARSGUARD"}</div><h2>گواهی رسمی سبد ${c.metal?"فلزات":"سهام بورسی"}</h2><div class="meta"><span>شماره: ${c.letter}</span><span>صدور: ${date(c.issued)} | ${time(c.issued)}</span></div></div><div class="rows"><div class="row"><span>نام مشتری</span><b>${esc(c.name)}</b></div><div class="row"><span>کد ملی</span><b>${c.national}</b></div><div class="row"><span>تلفن</span><b>${c.phone}</b></div><div class="row"><span>سرمایه</span><b>${money(c.amount)}</b></div></div><h4>${c.metal?"🪙 ترکیب سبد فلزات":"📊 ترکیب سبد سهام بورسی"}</h4><div class="${c.metal?"metalcards":"stockcards"}">${cards}</div><div class="livebox"><b>⚡ تغییر داخلی سبد ${c.metal?"فلزات":"سهام"}</b><div class="livegrid"><select id="cf">${keys.map(k=>`<option value="${k}">${c.metal?names(k):stocks[k].s}</option>`).join("")}</select><input id="cp" value="10" inputmode="numeric"><select id="ct">${keys.map((k,i)=>`<option value="${k}" ${i==1?"selected":""}>${c.metal?names(k):stocks[k].s}</option>`).join("")}</select></div><button class=btn onclick=convert()>🔄 ثبت تغییر داخلی</button></div><div class=history><b>📜 سوابق تغییرات</b>${history}</div><div class=signs><div><img src="${c.signature}" style="max-width:145px;height:48px"><br>امضای مشتری</div><div><div class=seal>PARSGUARD<br>OFFICIAL</div></div><div><div class=sig>Parsa Karami</div>نماینده</div></div><button class="btn printbtn" onclick=print()>🖨️ چاپ گواهی A4</button></div>`}function esc(s){return String(s).replace(/[&<>"']/g,x=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[x]))}["national","phone","amount"].forEach(id=>$(id).oninput=e=>{let v=norm(e.target.value).replace(/\D/g,"");if(id=="national")v=v.slice(0,10);if(id=="phone"){if(v&&!v.startsWith("0"))v="0"+v;v=v.slice(0,11)}e.target.value=v});setAlloc();showPrices();</script></body></html>
