<!doctype html><html lang="fa" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PARSGUARD | گواهی سرمایه‌گذاری</title>
<style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#49360a,#080808 42%,#000);color:#eee;font-family:Tahoma,Arial,sans-serif}.wrap{max-width:900px;margin:auto;padding:18px}.brand{text-align:center;font-size:28px;font-weight:900;color:#d8b45a;letter-spacing:2px}.sub{text-align:center;color:#aaa;margin:5px 0 18px}.box{background:linear-gradient(145deg,#151515,#080808);border:1px solid #725b22;border-radius:18px;padding:20px;box-shadow:0 12px 40px #000}.steps{display:flex;gap:5px;margin-bottom:15px}.step{flex:1;text-align:center;padding:8px 3px;border:1px solid #333;border-radius:9px;color:#777;font-size:11px}.step.on{border-color:#cda94e;color:#e3c76b;background:#17130a}.cardgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:15px}.choice{cursor:pointer;border:1px solid #444;border-radius:15px;padding:24px;text-align:center;background:#101010;transition:.2s}.choice:hover,.choice.sel{border-color:#d5af55;box-shadow:0 0 20px #8d6b2040}.choice .ico{font-size:45px}.choice b{display:block;font-size:20px;margin:10px}.choice small{color:#999}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{margin-bottom:12px}.field label{display:block;font-size:12px;color:#bbb;margin-bottom:6px}.field input,.field select{width:100%;padding:13px;border-radius:10px;border:1px solid #444;background:#080808;color:#fff;outline:none}.field input:focus,.field select:focus{border-color:#cda94e}.amountWords{font-size:11px;color:#d6bb70;margin-top:-6px;margin-bottom:10px;min-height:17px}.btns{display:flex;gap:9px;margin-top:18px}.btn{border:0;border-radius:10px;padding:12px 18px;cursor:pointer;font-weight:bold}.next{background:linear-gradient(135deg,#e4c36a,#987323);color:#111;flex:1}.back{background:#191919;color:#ddd;border:1px solid #555}.danger{background:#351313;color:#ffb0b0;border:1px solid #633}.hidden{display:none!important}.summary{border:1px solid #59471d;border-radius:12px;padding:15px;line-height:2;background:#0c0c0c}.alloc{display:grid;grid-template-columns:1fr 100px;gap:8px;align-items:center;margin:8px 0}.alloc input{padding:9px!important}.total{padding:12px;border-radius:10px;text-align:center;background:#151515;margin-top:12px}.total.ok{color:#d9bd63;border:1px solid #80651f}.total.bad{color:#ff9d9d;border:1px solid #6b2929}.transfer{border-top:1px solid #333;margin-top:18px;padding-top:15px}.history{font-size:12px;color:#bbb;line-height:2;margin-top:10px}.signature{background:#fff;border-radius:10px;display:block;width:100%;height:190px;touch-action:none}.sigbox{background:#171717;padding:12px;border-radius:12px}.certwrap{display:flex;justify-content:center;margin-top:15px}.certificate{width:820px;min-height:1080px;background:linear-gradient(135deg,#fffdf7,#f4edda);color:#171717;padding:30px;border:8px double #a9822d;position:relative;box-shadow:0 10px 35px #000;overflow:hidden}.certificate:before{content:"";position:absolute;inset:12px;border:1px solid #b59651;pointer-events:none}.certificate:after{content:"PARSGUARD";position:absolute;left:50%;top:52%;transform:translate(-50%,-50%) rotate(-25deg);font-size:70px;font-weight:900;color:#8d722c10;pointer-events:none}.certhead{text-align:center;border-bottom:2px solid #a9822d;padding:5px 20px 15px;position:relative}.symbol{width:105px;height:105px;margin:0 auto 5px;border:2px solid #9a7628;border-radius:50%;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle,#fffdf5,#e9dfc2);box-shadow:0 0 0 5px #eee6d2,0 0 0 7px #a9822d;color:#70551d}.mineIcon{font-size:52px}.eagleIcon{font-size:58px}.certtitle{font-size:27px;font-weight:900;color:#6f541b;margin:7px}.certsub{font-size:12px;color:#555}.official{display:inline-block;margin-top:7px;padding:4px 16px;border:1px solid #b59651;border-radius:20px;font-size:9px;color:#80631f;letter-spacing:1px}.meta{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:13px 0}.meta div,.customer div{border:1px solid #cbbd99;padding:7px;text-align:center;background:#f1ecde;font-size:11px}.customer{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:10px 0}.customerTitle{text-align:right;font-weight:900;color:#6f541b;margin:8px 2px 5px;font-size:13px}.customer div b{display:block;font-size:9px;color:#806f4c;margin-bottom:3px}.certintro{font-size:12px;line-height:1.9;text-align:justify;margin:10px 5px}.ctable{width:100%;border-collapse:collapse;font-size:10px;margin:10px 0}.ctable th{background:#29230f;color:#fff}.ctable th,.ctable td{border:1px solid #9c895b;padding:7px;text-align:center}.ctable td{background:#fffdf8}.price{font-size:9px;color:#6f541b}.words{font-size:9px;color:#5c513d;margin-top:2px}.certfooter{display:grid;grid-template-columns:1fr 1fr;gap:25px;margin-top:18px;text-align:center}.signline{height:55px;border-bottom:1px solid #777;margin:5px 20px}.customerSig{height:55px;max-width:150px;display:block;margin:0 auto;object-fit:contain}.rep{font-family:cursive;font-size:21px}.seal{width:76px;height:76px;border:3px double #80631f;border-radius:50%;margin:auto;display:flex;align-items:center;justify-content:center;font-size:10px;color:#80631f;font-weight:bold;transform:rotate(-8deg)}.certbuttons{display:flex;gap:8px;justify-content:center;margin:15px auto;max-width:820px}.certbuttons button{padding:12px 20px}.stockcert{border-color:#24364b;background:linear-gradient(135deg,#fbfaf7,#edf0f2)}.stockcert:before{border-color:#71869e}.stockcert .certhead{border-color:#526c89}.stockcert .certtitle{color:#263e5c}.stockcert .symbol{border-color:#526c89;box-shadow:0 0 0 5px #e7ebef,0 0 0 7px #526c89}.stockcert .ctable th{background:#25384e}.stockcert .customerTitle{color:#263e5c}.stockcert .official{border-color:#71869e;color:#526c89}.letter{font-family:Georgia,serif;letter-spacing:1px}.notice{padding:10px;border:1px solid #59471d;border-radius:9px;color:#d8bd73;background:#111;font-size:12px;margin-bottom:12px}
@media(max-width:650px){.wrap{padding:10px}.row,.cardgrid{grid-template-columns:1fr}.certificate{width:100%;min-height:auto;padding:18px;border-width:5px}.certtitle{font-size:21px}.meta,.customer{grid-template-columns:1fr 1fr}.ctable{font-size:8px}.ctable th,.ctable td{padding:5px}.certfooter{gap:8px}.btn{padding:11px 12px}.signature{height:170px}}
@media print{body{background:#fff!important}.wrap>*:not(#certificateArea),.certbuttons{display:none!important}.certwrap{margin:0!important}.certificate{display:block!important;width:190mm!important;min-height:277mm!important;height:277mm!important;margin:0 auto!important;padding:7mm!important;border-width:5px!important;box-shadow:none!important;transform:none!important}.certificate:before{inset:5mm!important}.certificate:after{font-size:60px}.symbol{width:82px;height:82px}.mineIcon{font-size:40px}.eagleIcon{font-size:44px}.certhead{padding:2px 15px 7px}.certtitle{font-size:22px}.certsub{font-size:9px}.official{margin-top:3px;font-size:7px;padding:3px 12px}.meta{margin:7px 0}.meta div,.customer div{padding:4px;font-size:9px}.customerTitle{font-size:10px;margin:5px 2px 3px}.certintro{margin:6px 4px;line-height:1.5;font-size:10px}.ctable{margin:6px 0;font-size:8px}.ctable th,.ctable td{padding:4px}.price,.words{font-size:7px}.certfooter{margin-top:8px}.signline{height:42px}.customerSig{height:42px}.rep{font-size:18px}.seal{width:60px;height:60px;font-size:8px}@page{size:A4;margin:0}}
</style></head><body><div class="wrap">
<div class="brand">PARSGUARD</div><div class="sub">سامانه نمونه مدیریت سبد و گواهی سرمایه‌گذاری</div>
<div class="steps" id="steps"><div class="step on">۱ انتخاب</div><div class="step">۲ اطلاعات</div><div class="step">۳ تأیید</div><div class="step">۴ مدیریت سبد</div><div class="step">۵ امضا</div><div class="step">۶ گواهی</div></div>
<div class="box" id="app"></div><div id="certificateArea" class="hidden"></div></div>
<script>
const $=x=>document.getElementById(x);
let S={step:1,type:"",name:"",national:"",phone:"",amount:0,letter:""};
let DB={metal:{alloc:{},history:[],sig:false,sigData:"",date:"",time:"",letter:""},stock:{alloc:{},history:[],sig:false,sigData:"",date:"",time:"",letter:""}};
const metals={gold:{fa:"طلا",en:"Gold",sym:"Au",price:24000000},silver:{fa:"نقره",en:"Silver",sym:"Ag",price:490000},copper:{fa:"مس",en:"Copper",sym:"Cu",price:2148}};
const stocks={dairy:{fa:"دامداری",price:15000},bank:{fa:"بانکی",price:23000},tourism:{fa:"گردشگری",price:20000},agri:{fa:"کشت و صنعت",price:30000}};
function nd(x){return String(x||"").replace(/[۰-۹]/g,d=>"۰۱۲۳۴۵۶۷۸۹".indexOf(d)).replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d))}
function money(x){return Number(x||0).toLocaleString("en-US")}
const ones=["","یک","دو","سه","چهار","پنج","شش","هفت","هشت","نه","ده","یازده","دوازده","سیزده","چهارده","پانزده","شانزده","هفده","هجده","نوزده"],tens=["","","بیست","سی","چهل","پنجاه","شصت","هفتاد","هشتاد","نود"],hund=["","صد","دویست","سیصد","چهارصد","پانصد","ششصد","هفتصد","هشتصد","نهصد"],sc=["","هزار","میلیون","میلیارد","تریلیون"];
function three(n){let a=[];if(Math.floor(n/100))a.push(hund[Math.floor(n/100)]),n%=100;if(n){if(a.length)a.push("و");if(n<20)a.push(ones[n]);else{a.push(tens[Math.floor(n/10)]);if(n%10)a.push("و",ones[n%10])}}return a.join(" ")}
function words(n){n=Math.floor(Number(n)||0);if(!n)return"صفر تومان";let a=[],i=0;while(n){let x=n%1000;if(x){let z=three(x);if(i)z+=" "+sc[i];a.unshift(z)}n=Math.floor(n/1000);i++}return a.join(" و ")+" تومان"}
function state(){return DB[S.type]}
function now(){let d=new Date(),z=state();z.date=d.toLocaleDateString("fa-IR");z.time=d.toLocaleTimeString("fa-IR",{hour:"2-digit",minute:"2-digit"});if(!z.letter)z.letter="PG-"+d.getFullYear()+"-"+Math.floor(10000+Math.random()*90000)}
function setStep(n){S.step=n;render()}
function render(){
document.querySelectorAll(".step").forEach((x,i)=>x.classList.toggle("on",i<S.step));
let a=$("app");a.classList.remove("hidden");$("certificateArea").classList.add("hidden");
if(S.step==1)a.innerHTML=`<div class="notice">سبد سرمایه‌گذاری مورد نظر خود را انتخاب کنید.</div><div class="cardgrid"><div class="choice ${S.type=="metal"?"sel":""}" onclick="choose('metal')"><div class="ico">🥇⚪🟠</div><b>سبد فلزات</b><small>GOLD • SILVER • COPPER</small></div><div class="choice ${S.type=="stock"?"sel":""}" onclick="choose('stock')"><div class="ico">🦅</div><b>سبد سهام بورسی</b><small>DAIRY • BANK • TOURISM • AGRI</small></div></div>`;
if(S.step==2)a.innerHTML=`<h3>اطلاعات سرمایه‌گذار</h3><div class="row"><div class="field"><label>نام و نام خانوادگی</label><input id="name" value="${S.name}"></div><div class="field"><label>کد ملی</label><input id="national" inputmode="numeric" maxlength="10" value="${S.national}"></div><div class="field"><label>شماره همراه</label><input id="phone" inputmode="numeric" maxlength="11" value="${S.phone}"></div><div class="field"><label>مبلغ سرمایه‌گذاری (تومان)</label><input id="amount" inputmode="numeric" value="${S.amount?money(S.amount):""}" oninput="formatAmount(this)"><div id="aw" class="amountWords">${S.amount?words(S.amount):""}</div></div></div><div class="btns"><button class="btn back" onclick="back()">بازگشت</button><button class="btn next" onclick="infoNext()">ادامه</button></div>`;
if(S.step==3)a.innerHTML=`<h3>تأیید اطلاعات</h3><div class="summary">نام: ${S.name}<br>کد ملی: ${S.national}<br>تلفن: ${S.phone}<br>مبلغ: ${money(S.amount)} تومان<br><small>${words(S.amount)}</small><br>نوع سبد: ${S.type=="metal"?"فلزات":"سهام بورسی"}</div><div class="btns"><button class="btn back" onclick="back()">بازگشت</button><button class="btn next" onclick="setStep(4)">تأیید و مدیریت سبد</button></div>`;
if(S.step==4){let z=state(),ob=S.type=="metal"?metals:stocks,keys=Object.keys(ob);if(!Object.keys(z.alloc).length)keys.forEach((k,i)=>z.alloc[k]=S.type=="metal"?[40,35,25][i]:25);a.innerHTML=`<h3>مدیریت درصدهای سبد ${S.type=="metal"?"فلزات":"سهام بورسی"}</h3>${keys.map(k=>`<div class="alloc"><span>${ob[k].fa}<small style="color:#888"> | ${money(ob[k].price)} تومان</small></span><input id="p_${k}" type="number" min="0" max="100" value="${z.alloc[k]}" oninput="liveTotal()">%</div>`).join("")}<div class="total ok" id="tot">جمع: 100%</div><div class="transfer"><b>انتقال داخلی درصد</b><div class="row"><div class="field"><label>از</label><select id="from">${keys.map(k=>`<option value="${k}">${ob[k].fa}</option>`).join("")}</select></div><div class="field"><label>به</label><select id="to">${keys.map(k=>`<option value="${k}">${ob[k].fa}</option>`).join("")}</select></div></div><div class="field"><label>درصد انتقال</label><input id="tr" type="number" min="0" max="100" value="0"></div><button class="btn back" onclick="transfer()">اجرای انتقال</button><div class="history">${z.history.map(x=>x+"<br>").join("")}</div></div><div class="btns"><button class="btn back" onclick="back()">بازگشت</button><button class="btn next" onclick="allocNext()">ذخیره درصدها و ادامه</button></div>`}
if(S.step==5)a.innerHTML=`<h3>امضای دیجیتال مشتری</h3><p style="color:#aaa;font-size:12px">لطفاً داخل کادر زیر امضای خود را رسم کنید.</p><div class="sigbox"><canvas id="sig" class="signature"></canvas></div><div class="btns"><button class="btn back" onclick="back()">بازگشت</button><button class="btn danger" onclick="clearSig()">پاک کردن امضا</button><button class="btn next" onclick="issue()">تأیید امضا و صدور گواهی</button></div>`;
if(S.step==6)showCert();
if(S.step==5)initCanvas()
}
function choose(t){S.type=t;let z=DB[t];if(z.letter){S.name=z.name||S.name;S.national=z.national||S.national;S.phone=z.phone||S.phone;S.amount=z.amount||S.amount}setStep(2)}
function formatAmount(el){let n=Number(nd(el.value).replace(/\D/g,""))||0;el.value=n?money(n):"";$("aw").textContent=n?words(n):""}
function showWords(){let n=Number(nd($("amount").value).replace(/\D/g,""));$("aw").textContent=n?words(n):""}
function infoNext(){S.name=$("name").value.trim();S.national=nd($("national").value).replace(/\D/g,"");S.phone=nd($("phone").value).replace(/\D/g,"");S.amount=Number(nd($("amount").value).replace(/\D/g,""));if(!S.name||S.national.length!=10||S.phone.length!=11||!S.phone.startsWith("09")||!S.amount)return alert("اطلاعات را صحیح و کامل وارد کنید.");let z=state();z.name=S.name;z.national=S.national;z.phone=S.phone;z.amount=S.amount;setStep(3)}
function liveTotal(){let ob=S.type=="metal"?metals:stocks,t=Object.keys(ob).reduce((a,k)=>a+(Number($("p_"+k)?.value)||0),0),e=$("tot");e.textContent="جمع: "+t+"%";e.className="total "+(t==100?"ok":"bad")}
function allocNext(){let z=state(),ob=S.type=="metal"?metals:stocks;Object.keys(ob).forEach(k=>z.alloc[k]=Number($("p_"+k).value)||0);let t=Object.values(z.alloc).reduce((a,b)=>a+b,0);if(t!=100)return alert("جمع درصدها باید دقیقاً ۱۰۰٪ باشد.");setStep(5)}
function transfer(){let z=state(),f=$("from").value,t=$("to").value,n=Number($("tr").value)||0,ob=S.type=="metal"?metals:stocks;if(f==t||n<=0)return alert("مبدأ و مقصد را درست انتخاب کنید.");if(z.alloc[f]<n)return alert("درصد مبدأ کافی نیست.");z.alloc[f]-=n;z.alloc[t]+=n;let d=new Date(),ds=d.toLocaleDateString("fa-IR"),ts=d.toLocaleTimeString("fa-IR",{hour:"2-digit",minute:"2-digit"});z.history.push(`در تاریخ ${ds} و ساعت ${ts}، ${n}% ${ob[f].fa} به ${ob[t].fa} تبدیل شد.`);render()}
function initCanvas(){let c=$("sig");if(!c)return;let ctx=c.getContext("2d"),r=c.getBoundingClientRect(),d=devicePixelRatio||1;c.width=r.width*d;c.height=r.height*d;ctx.scale(d,d);ctx.lineWidth=2.2;ctx.lineCap="round";if(state().sigData){let im=new Image();im.onload=()=>ctx.drawImage(im,0,0,r.width,r.height);im.src=state().sigData}let down=false;c.onpointerdown=e=>{down=true;ctx.beginPath();ctx.moveTo(e.offsetX,e.offsetY)};c.onpointermove=e=>{if(down){ctx.lineTo(e.offsetX,e.offsetY);ctx.stroke();state().sig=true}};c.onpointerup=()=>down=false;c.onpointercancel=()=>down=false}
function clearSig(){state().sig=false;state().sigData="";render()}
function issue(){let z=state();if(!z.sig)return alert("ابتدا امضای دیجیتال خود را ثبت کنید.");let c=$("sig");z.sigData=c.toDataURL("image/png");now();setStep(6)}
function back(){if(S.step>1)setStep(S.step-1)}
function showCert(){let z=state(),ob=S.type=="metal"?metals:stocks,keys=Object.keys(ob),isM=S.type=="metal";$("app").classList.add("hidden");let rows=keys.map(k=>{let p=z.alloc[k]||0,v=S.amount*p/100,q=v/ob[k].price;return `<tr><td><b>${ob[k].fa}</b><div class="price">قیمت واحد: ${money(ob[k].price)} تومان</div></td><td>${isM?ob[k].en:"سهم"}</td><td>${isM?ob[k].sym:"—"}</td><td><b>${p}%</b></td><td><b>${money(v)} تومان</b><div class="words">${words(v)}</div></td><td>${isM?q.toFixed(4)+" گرم":money(Math.floor(q))+" سهم"}</td></tr>`}).join("");
$("certificateArea").classList.remove("hidden");$("certificateArea").innerHTML=`<div class="certwrap"><div class="certificate ${isM?"":"stockcert"}"><div class="certhead"><div class="symbol">${isM?'<div class="mineIcon">⛏️</div>':'<div class="eagleIcon">🦅</div>'}</div><div class="certtitle">${isM?"گواهی رسمی سرمایه‌گذاری فلزات":"OFFICIAL SHARE INVESTMENT CERTIFICATE"}</div><div class="certsub">PARSGUARD | سامانه نمونه مدیریت سبد و گواهی سرمایه‌گذاری</div><div class="official">OFFICIAL INVESTMENT CERTIFICATE</div></div><div class="meta"><div>شماره نامه<br><b class="letter">${z.letter}</b></div><div>تاریخ صدور<br><b>${z.date}</b></div><div>ساعت صدور<br><b>${z.time}</b></div></div><div class="customerTitle">مشخصات سرمایه‌گذار</div><div class="customer"><div><b>نام و نام خانوادگی</b>${S.name}</div><div><b>کد ملی</b>${S.national}</div><div><b>شماره همراه</b>${S.phone}</div><div><b>مبلغ سرمایه‌گذاری</b>${money(S.amount)} تومان<div class="words">${words(S.amount)}</div></div></div><div class="certintro">بدین‌وسیله گواهی می‌شود <b>${S.name}</b> با مشخصات فوق، مبلغ <b>${money(S.amount)} تومان</b> را در ${isM?"سبد فلزات":"سبد سهام بورسی"} PARSGUARD مطابق ترکیب ثبت‌شده زیر اختصاص داده است.</div><table class="ctable"><thead><tr><th>دارایی / قیمت واحد</th><th>عنوان</th><th>نماد</th><th>درصد</th><th>ارزش اختصاص‌یافته</th><th>مقدار تقریبی</th></tr></thead><tbody>${rows}</tbody></table>${z.history.length?`<div style="border:1px solid #b9a675;padding:7px;font-size:9px;line-height:1.8"><b>سوابق مدیریت سبد:</b><br>${z.history.join("<br>")}</div>`:""}<div class="certfooter"><div><b>امضای دیجیتال مشتری</b>${z.sigData?`<img class="customerSig" src="${z.sigData}" alt="امضای مشتری">`:`<div class="signline"></div>`}<small>ثبت شده در سامانه PARSGUARD</small></div><div><b>نماینده شرکت</b><div class="rep">Parsa Karami</div><div class="seal">PARSGUARD<br>OFFICIAL</div></div></div></div></div><div class="certbuttons"><button class="btn back" onclick="setStep(5)">بازگشت به امضا</button><button class="btn back" onclick="setStep(4)">تغییر سبد / درصدها</button><button class="btn next" onclick="window.print()">چاپ گواهی</button></div>`}
render();
</script></body></html>
