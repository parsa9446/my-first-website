<!doctype html><html lang="fa" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PARSGUARD | قراردادهای سرمایه‌گذاری</title><style>
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at 50% -10%,#33270b 0,#0b0b0b 35%,#030303 100%);color:#eee;font-family:tahoma,Arial,sans-serif;min-height:100vh}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background:linear-gradient(115deg,transparent 35%,rgba(214,173,60,.025) 50%,transparent 65%);animation:shine 7s linear infinite}
@keyframes shine{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
header{padding:28px 15px;text-align:center;border-bottom:1px solid #8d6b18;background:rgba(0,0,0,.72);position:relative}
header h1{margin:0;color:#d6ad3c;font-size:30px;text-shadow:0 0 20px #d6ad3c44}
header p{color:#aaa;margin:10px 0 0}
.wrap{max-width:1100px;margin:auto;padding:20px}
.card{background:linear-gradient(145deg,#151515,#080808);border:1px solid #725716;border-radius:20px;padding:22px;margin-bottom:20px;box-shadow:0 10px 35px #000;position:relative;overflow:hidden}
.card:before{content:"";position:absolute;top:0;left:-100%;width:50%;height:1px;background:linear-gradient(90deg,transparent,#f0ce58,transparent);animation:borderRun 5s linear infinite}
@keyframes borderRun{0%{left:-100%}100%{left:200%}}
.title{color:#e0b93f;font-size:22px;font-weight:bold;margin-bottom:15px}
.types{display:grid;grid-template-columns:repeat(2,1fr);gap:20px}
.type{position:relative;padding:35px 25px;text-align:center;border:1px solid #80631e;border-radius:22px;background:linear-gradient(145deg,#171717,#090909);cursor:pointer;transition:.45s;overflow:hidden;box-shadow:inset 0 0 25px #000}
.type:before{content:"";position:absolute;inset:-2px;background:linear-gradient(120deg,transparent,#d6ad3c33,transparent);transform:translateX(-100%);transition:.7s}
.type:after{content:"";position:absolute;width:90px;height:90px;border-radius:50%;background:#d6ad3c12;filter:blur(20px);top:-30px;right:-30px;transition:.5s}
.type:hover{transform:translateY(-9px) scale(1.025);border-color:#e3bd4a;box-shadow:0 18px 45px #d6ad3c20,0 0 25px #d6ad3c15}
.type:hover:before{transform:translateX(100%)}
.type:hover:after{transform:scale(2);background:#d6ad3c20}
.type b{display:block;color:#e5bd48;font-size:22px;margin-bottom:10px;position:relative;z-index:2}
.type span{color:#aaa;position:relative;z-index:2}
.type:first-child b{animation:goldPulse 2.5s infinite}
.type:last-child b{animation:stockPulse 2.5s infinite}
@keyframes goldPulse{0%,100%{text-shadow:0 0 5px #d6ad3c22}50%{text-shadow:0 0 20px #d6ad3c88}}
@keyframes stockPulse{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
label{display:block;color:#d9b64a;margin:12px 0 6px}
input,select{width:100%;padding:13px;border-radius:10px;border:1px solid #765b1b;background:#090909;color:#fff;font-size:15px;outline:none}
input:focus,select:focus{border-color:#d5ad37;box-shadow:0 0 15px #d5ad3720}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:15px}
.alloc{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.alloc div{background:#0b0b0b;border:1px solid #4d3b12;padding:10px;border-radius:10px}
.alloc input{margin-top:5px}
.btn{border:0;border-radius:12px;padding:14px 20px;background:linear-gradient(135deg,#b88b18,#f0ce58,#9b7211);color:#111;font-weight:bold;cursor:pointer;font-size:16px;margin-top:18px;transition:.3s;box-shadow:0 8px 25px #b88b1825}
.btn:hover{filter:brightness(1.15);transform:translateY(-2px);box-shadow:0 12px 30px #d6ad3c35}
.hidden{display:none}
.sigbox{background:#fff;border-radius:12px;padding:5px;margin-top:8px;border:2px solid #b28a25;box-shadow:0 0 20px #d6ad3c18}
.sigbox canvas{width:100%;height:180px;display:block;touch-action:none;cursor:crosshair}
.clear{background:#222;color:#ddd;border:1px solid #6e5317;padding:8px 14px;border-radius:8px;margin-top:8px;cursor:pointer}
.certificate{position:relative;background:linear-gradient(135deg,#f8f4e6,#e9dfbd,#faf7ec);color:#181818;border:10px double #b28a25;border-radius:18px;padding:32px;margin-top:20px;box-shadow:0 20px 70px #000,0 0 35px #d6ad3c25;overflow:hidden}
.certificate:before{content:"PARSGUARD";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-25deg);font-size:80px;font-weight:bold;color:#8b691a08;pointer-events:none}
.certificate:after{content:"";position:absolute;inset:10px;border:1px solid #b28a25;border-radius:10px;pointer-events:none}
.certhead{text-align:center;border-bottom:2px solid #b28a25;padding:10px 10px 20px;position:relative;z-index:1}
.certhead h2{margin:5px 0 10px;color:#76540d;font-size:27px;letter-spacing:.5px}
.certhead div{color:#67551e;font-size:14px}
.certgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:20px 0;position:relative;z-index:1}
.certitem{padding:12px 14px;background:#fffdf5;border:1px solid #d0bd83;border-radius:8px;box-shadow:0 3px 10px #76540d12}
.certitem b{color:#76540d}
.certtext{line-height:2;text-align:justify;position:relative;z-index:1}
.certtext p{background:#fffdf5;border-right:4px solid #b28a25;padding:12px 15px;border-radius:8px}
.certificate h3{color:#76540d;border-right:5px solid #b28a25;padding-right:10px;position:relative;z-index:1}
.signatures{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:30px;text-align:center;position:relative;z-index:1}
.signatures>div{background:#fffdf5;border:1px solid #d0bd83;border-radius:12px;padding:15px;min-height:155px;box-shadow:0 5px 18px #76540d12}
.signatures img{max-width:150px;max-height:100px;margin-top:12px}
.stamp{width:110px;height:110px;border:3px solid #9b2020;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#9b2020;margin:15px auto 0;font-weight:bold;transform:rotate(-12deg);background:#fff8f2}
.note{background:#fff1bd;border:1px solid #d0a52e;color:#5b4810;padding:13px;border-radius:10px;margin-top:20px;font-size:13px;position:relative;z-index:1}
.print{display:block;margin:25px auto}
.success{color:#9fdc72;margin-top:12px}
@media(max-width:700px){.types,.grid,.alloc,.certgrid,.signatures{grid-template-columns:1fr}.types{gap:12px}.type{padding:28px 18px}header h1{font-size:24px}.wrap{padding:10px}.card{padding:15px}.certificate{padding:20px 14px}.certhead h2{font-size:21px}}
@media print{body{background:#fff}.no-print{display:none!important}.certificate{box-shadow:none;margin:0}}
</style></head><body>

<header><h1>⚖️ PARSGUARD</h1><p>سامانه آزمایشی مدیریت و صدور قراردادهای سرمایه‌گذاری</p></header>

<main class="wrap">

<section class="card"><div class="title">نوع قرارداد را انتخاب کنید</div>
<div class="types">
<div class="type" onclick="choose('فلزات')"><b>🟡 سبد فلزات</b><span>طلا، نقره و مس</span></div>
<div class="type" onclick="choose('سهام')"><b>📈 سبد سهام</b><span>دامداری، بانکت، گردشگری تکاب و کشت و صنعت</span></div>
</div></section>

<section id="formCard" class="card hidden">
<div class="title" id="formTitle">اطلاعات قرارداد</div>

<div class="grid">
<div><label>نام و نام خانوادگی</label><input id="name" placeholder="مثلاً پارسا کرمی"></div>
<div><label>کد ملی</label><input id="national" inputmode="numeric" placeholder="کد ملی"></div>
<div><label>شماره تماس</label><input id="phone" inputmode="tel" placeholder="شماره تماس"></div>
<div><label>مدت قرارداد</label><select id="duration"><option value="3">۳ ماهه</option><option value="6">۶ ماهه</option><option value="12">۱۲ ماهه</option><option value="18">۱۸ ماهه</option><option value="24">۲۴ ماهه</option></select></div>
<div><label>مبلغ کل قرارداد (تومان)</label><input id="amount" type="number" placeholder="مثلاً 2000000"></div>
</div>

<div style="margin-top:20px"><div class="title" style="font-size:18px">تخصیص سبد</div>

<div class="alloc" id="metalAlloc">
<div>طلا<input id="gold" type="number" value="40" min="0" max="100"></div>
<div>نقره<input id="silver" type="number" value="35" min="0" max="100"></div>
<div>مس<input id="copper" type="number" value="25" min="0" max="100"></div>
</div>

<div class="alloc hidden" id="stockAlloc">
<div>دامداری<input id="farm" type="number" value="25" min="0" max="100"></div>
<div>بانکت<input id="bank" type="number" value="25" min="0" max="100"></div>
<div>گردشگری تکاب<input id="tour" type="number" value="25" min="0" max="100"></div>
<div>کشت و صنعت<input id="agri" type="number" value="25" min="0" max="100"></div>
</div></div>

<label>امضای دیجیتال مشتری</label>
<div class="sigbox"><canvas id="signature"></canvas></div>
<button class="clear no-print" id="clearBtn">پاک کردن امضا</button><br>
<button class="btn no-print" onclick="issue()">صدور قرارداد نمونه</button>
<div id="msg"></div>
</section>

<section id="result" class="certificate hidden"></section>
</main>

<script>
const $=id=>document.getElementById(id);
let selected="فلزات",cv=$("signature"),ctx=cv.getContext("2d"),drawing=false,hasDrawn=false;

function choose(type){
selected=type;
$("formCard").classList.remove("hidden");
$("formTitle").textContent="اطلاعات قرارداد "+type;
if(type==="فلزات"){
$("metalAlloc").classList.remove("hidden");
$("stockAlloc").classList.add("hidden")
}else{
$("metalAlloc").classList.add("hidden");
$("stockAlloc").classList.remove("hidden")
}
window.scrollTo({top:$("formCard").offsetTop-10,behavior:"smooth"})
}

function fit(){
let r=cv.getBoundingClientRect(),d=devicePixelRatio||1;
cv.width=Math.max(1,r.width*d);
cv.height=180*d;
ctx.setTransform(d,0,0,d,0,0);
ctx.lineWidth=2.5;
ctx.lineCap="round";
ctx.lineJoin="round";
ctx.strokeStyle="#111"
}
fit();
addEventListener("resize",fit);

function pos(e){
let r=cv.getBoundingClientRect();
return{x:e.clientX-r.left,y:e.clientY-r.top}
}

function down(e){
drawing=true;
hasDrawn=true;
let p=pos(e);
ctx.beginPath();
ctx.moveTo(p.x,p.y);
if(e.pointerId!=null)try{cv.setPointerCapture(e.pointerId)}catch(_){}
e.preventDefault()
}

function move(e){
if(!drawing)return;
let p=pos(e);
ctx.lineTo(p.x,p.y);
ctx.stroke();
e.preventDefault()
}

function up(e){
drawing=false;
if(e.pointerId!=null)try{cv.releasePointerCapture(e.pointerId)}catch(_){}
e.preventDefault()
}

cv.addEventListener("pointerdown",down);
cv.addEventListener("pointermove",move);
cv.addEventListener("pointerup",up);
cv.addEventListener("pointercancel",up);

$("clearBtn").onclick=()=>{
ctx.clearRect(0,0,cv.width,cv.height);
hasDrawn=false
};

function issue(){
let name=$("name").value.trim(),
national=$("national").value.trim(),
phone=$("phone").value.trim(),
amount=Number($("amount").value),
duration=Number($("duration").value);

if(!name||!national||!phone||!amount){
alert("لطفاً تمام اطلاعات را وارد کنید.");
return
}

let arr=selected==="فلزات"
?[{n:"طلا",v:+$("gold").value},{n:"نقره",v:+$("silver").value},{n:"مس",v:+$("copper").value}]
:[{n:"دامداری",v:+$("farm").value},{n:"بانکت",v:+$("bank").value},{n:"گردشگری تکاب",v:+$("tour").value},{n:"کشت و صنعت",v:+$("agri").value}];

let total=arr.reduce((a,x)=>a+x.v,0);

if(total!==100){
alert("درصدهای سبد باید دقیقاً ۱۰۰٪ باشند.");
return
}

if(!hasDrawn){
alert("لطفاً امضای دیجیتال مشتری را وارد کنید.");
return
}

let issueDate=new Date(),
expire=new Date(issueDate);
expire.setMonth(expire.getMonth()+duration);

let fmt=d=>d.toLocaleDateString("fa-IR"),
num=Math.floor(100000+Math.random()*900000),
alloc=arr.map(x=>"<div class='certitem'><b>"+x.n+":</b> "+x.v+"٪ — "+Math.round(amount*x.v/100).toLocaleString("fa-IR")+" تومان</div>").join(""),
sig=cv.toDataURL("image/png");

$("result").innerHTML=
"<div class='certhead'><div style='font-size:12px;letter-spacing:2px'>PARSGUARD OFFICIAL SAMPLE</div><h2>🏆 گواهی و قرارداد سرمایه‌گذاری</h2><div>سامانه آزمایشی مدیریت قراردادهای سرمایه‌گذاری</div></div>"+

"<div class='certgrid'>"+
"<div class='certitem'><b>شماره قرارداد:</b> PG-"+num+"</div>"+
"<div class='certitem'><b>نوع قرارداد:</b> سبد "+selected+"</div>"+
"<div class='certitem'><b>نام مشتری:</b> "+name+"</div>"+
"<div class='certitem'><b>کد ملی:</b> "+national+"</div>"+
"<div class='certitem'><b>شماره تماس:</b> "+phone+"</div>"+
"<div class='certitem'><b>مبلغ قرارداد:</b> "+amount.toLocaleString("fa-IR")+" تومان</div>"+
"<div class='certitem'><b>مدت قرارداد:</b> "+duration+" ماه</div>"+
"<div class='certitem'><b>تاریخ صدور:</b> "+fmt(issueDate)+"</div>"+
"<div class='certitem'><b>تاریخ اعتبار:</b> "+fmt(expire)+"</div>"+
"<div class='certitem'><b>وضعیت:</b> نمونه آزمایشی</div>"+
"</div>"+

"<h3>📊 ترکیب سبد انتخابی</h3>"+
"<div class='certgrid'>"+alloc+"</div>"+

"<div class='certtext'>"+
"<p>این سند صرفاً یک قرارداد و گواهی نمونه آزمایشی برای نمایش فرایند ثبت اطلاعات، تخصیص سبد، امضای دیجیتال و صدور گواهی در سامانه PARSGUARD است. این سند به‌تنهایی ایجادکننده تعهد مالی، مالکیت دارایی، بیمه، تضمین سود یا رابطه قراردادی واقعی نیست.</p>"+
"<p>مشتری با ثبت اطلاعات و امضای دیجیتال نمونه، ترکیب انتخابی سبد و مبلغ فرضی قرارداد را تأیید می‌کند. هرگونه استفاده واقعی از خدمات مالی، سرمایه‌گذاری، بیمه یا قراردادهای مشابه منوط به مجوزها، قراردادهای معتبر و فرایندهای قانونی مربوط خواهد بود.</p>"+
"</div>"+

"<div class='signatures'>"+
"<div><b>✍️ امضای مشتری</b><br><img src='"+sig+"'></div>"+
"<div><b>🔴 مهر شرکت</b><br><div class='stamp'>PARSGUARD<br>نمونه</div></div>"+
"<div><b>👤 نماینده شرکت</b><br><div style='font-family:cursive;font-size:25px;margin:25px 0'>Parsa Karami</div></div>"+
"</div>"+

"<div class='note'>⚠️ این گواهی آزمایشی است و سند رسمی سرمایه‌گذاری یا تعهد مالی محسوب نمی‌شود.</div>"+
"<button class='btn print no-print' onclick='window.print()'>🖨 چاپ / ذخیره گواهی</button>";

$("result").classList.remove("hidden");
$("result").scrollIntoView({behavior:"smooth"})
}
</script></body></html>
