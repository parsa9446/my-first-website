<!doctype html><html lang="fa" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PARSGUARD | قراردادهای سرمایه‌گذاری</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#30250b,#0b0b0b 38%,#030303);color:#eee;font-family:tahoma,Arial}.wrap{max-width:1100px;margin:auto;padding:18px}.head,.card,.signaturebox{background:linear-gradient(145deg,#161616,#090909);border:1px solid #80651d;border-radius:20px;padding:20px;margin-top:16px;box-shadow:0 12px 40px #000}.head{text-align:center}.head h1{margin:0;color:#d7ad45;letter-spacing:3px}.head p{color:#aaa}.types{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.type{padding:22px;text-align:center;border:1px solid #594719;border-radius:16px;background:#151515;cursor:pointer;transition:.25s}.type.active,.type:hover{border-color:#d4ad4a;transform:translateY(-3px);box-shadow:0 0 25px #8b691c44}.ico{font-size:45px}.grid,.livegrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}label{display:block;color:#c7a34a;font-size:13px;margin:6px 0}input,select{width:100%;padding:12px;border-radius:10px;border:1px solid #51431e;background:#090909;color:#fff;outline:0}.btn{border:0;border-radius:11px;padding:12px 18px;background:linear-gradient(135deg,#d6ad43,#80601b);color:#111;font-weight:bold;cursor:pointer;margin-top:12px}.price,.row{display:flex;justify-content:space-between;gap:8px;padding:9px;border-bottom:1px dashed #9b8b65}.price{color:#ddd;border-color:#29230f}.warn{color:#d9ad42;font-size:12px;margin-top:10px}.ok{color:#7edb8b;font-size:12px;margin-top:8px}.total{text-align:center;color:#dcb650;font-weight:bold;margin:10px}.signaturebox canvas{width:100%;height:150px;background:#fff;border-radius:10px;touch-action:none}.hidden{display:none}.certificate{background:#f1e8ce;color:#201a0d;border:8px double #9d7928;border-radius:4px;padding:25px;margin-top:20px;box-shadow:0 15px 50px #000;position:relative}.certificate:before{content:"";position:absolute;inset:8px;border:1px solid #b99645;pointer-events:none}.certtop{text-align:center;border-bottom:2px solid #9d7928;padding-bottom:12px}.certtop h2{margin:5px;color:#735313}.meta{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:12px}.rows{margin-top:15px}.metalcards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}.mcard{border:1px solid #a88b4a;background:#f7efd9;padding:12px;text-align:center;border-radius:12px}.mcard b{font-size:25px;color:#775915}.livebox{margin:18px 0;padding:15px;border:2px solid #b58d32;border-radius:15px;background:#fff7dc}.livegrid{grid-template-columns:repeat(3,1fr)}.livebox label{color:#6b5016}.live-status{margin-top:9px;font-size:12px;color:#69521e}.history{margin-top:15px;border-top:2px solid #9d7928;padding-top:10px}.signs{display:flex;justify-content:space-between;gap:20px;margin-top:25px;text-align:center}.sig{font-family:cursive;font-size:24px;color:#222}.seal{border:3px solid #8d6722;border-radius:50%;width:90px;height:90px;display:flex;align-items:center;justify-content:center;margin:auto;color:#765517;font-size:11px}.mine{font-size:45px}.minetxt{font-size:11px;letter-spacing:2px}.stock{background:#e5ebf0;border-color:#274967}.stock .certtop h2{color:#244866}.manager{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.contractItem{border:1px solid #594719;border-radius:12px;padding:12px;background:#101010}.contractItem b{color:#d7ad45}.small{font-size:11px;color:#aaa}@media(max-width:700px){.grid,.types,.metalcards,.livegrid,.manager{grid-template-columns:1fr}.certificate{padding:14px}}@media print{body{background:#fff}.wrap>*:not(#result){display:none!important}#result{display:block!important;margin:0;padding:0}.certificate{margin:0;box-shadow:none;min-height:270mm;page-break-after:avoid}.livebox,.printbtn{display:none!important}@page{size:A4;margin:8mm}}</style></head><body><div class="wrap"><div class="head"><h1>PARSGUARD</h1><p>⚖️ سامانه مدیریت و صدور قراردادهای سرمایه‌گذاری</p></div><div class="card"><h3>نوع قرارداد</h3><div class="types"><div id="metalType" class="type active" onclick="choose(1)"><div class="ico">⛏️</div><b>سبد فلزات</b><br><small>طلا • نقره • مس</small></div><div id="stockType" class="type" onclick="choose(0)"><div class="ico">🦅</div><b>سبد سهام</b><br><small>دامداری • بانک • گردشگری • کشت و صنعت</small></div></div></div><div class="card"><h3>اطلاعات مشتری</h3><div class="grid"><div><label>نام و نام خانوادگی</label><input id="name"></div><div><label>کد ملی</label><input id="national" inputmode="numeric" maxlength="10"></div><div><label>شماره تلفن</label><input id="phone" inputmode="numeric" maxlength="11" placeholder="09xxxxxxxxx"></div><div><label>مبلغ سرمایه‌گذاری (تومان)</label><input id="amount" inputmode="numeric"></div><div><label>مدت قرارداد</label><select id="duration"><option value="1">۱ ماهه</option><option value="3">۳ ماهه</option><option value="6">۶ ماهه</option><option value="12" selected>۱۲ ماهه</option><option value="24">۲۴ ماهه</option><option value="60">۶۰ ماهه</option></select></div></div><div id="alloc"></div><div id="prices"></div><div class="warn">⚠️ این سامانه نمونه/آزمایشی است و ارقام آن تضمین معامله واقعی یا بازدهی سرمایه‌گذاری نیستند.</div><button class="btn" onclick="startSign()">✍️ ثبت اطلاعات و ادامه</button></div><div id="signbox" class="signaturebox hidden"><h3>امضای دیجیتال</h3><canvas id="canvas"></canvas><button class="btn" onclick="clearSign()">پاک کردن امضا</button><button class="btn" onclick="issue()">صدور گواهی</button></div><div id="result"></div><div class="card"><h3>📂 مدیریت قراردادها</h3><div id="manager" class="manager"></div></div></div><script>const $=x=>document.getElementById(x),norm=s=>(s||"").replace(/[۰-۹]/g,x=>"۰۱۲۳۴۵۶۷۸۹".indexOf(x)).replace(/[٠-٩]/g,x=>"٠١٢٣٤٥٦٧٨٩".indexOf(x)),money=n=>Number(n||0).toLocaleString("fa-IR")+" تومان",date=d=>new Date(d).toLocaleDateString("fa-IR"),time=d=>new Date(d).toLocaleTimeString("fa-IR",{hour:"2-digit",minute:"2-digit"}),names=k=>({gold:"طلا",silver:"نقره",copper:"مس",dam:"دامداری",bank:"بانک",tour:"گردشگری تکاب",farm:"کشت و صنعت"})[k]||k;let isMetal=1,draft,contracts=JSON.parse(localStorage.getItem("PG_CONTRACTS")||"[]"),prices={gold:24000000,silver:490000,copper:2500},currentCert=null,lastPriceUpdate=null;function choose(x){isMetal=x;$("metalType").classList.toggle("active",!!x);$("stockType").classList.toggle("active",!x);setAlloc();showPrices()}function setAlloc(){let a=isMetal?{gold:40,silver:35,copper:25}:{dam:25,bank:25,tour:25,farm:25};$("alloc").innerHTML="<h3>تخصیص سرمایه</h3>"+Object.entries(a).map(([k,v])=>`<label>${names(k)} (%)</label><input class="ap" data-k="${k}" value="${v}" inputmode="numeric">`).join("")+`<div class="total" id="tot">جمع: 100%</div>`;document.querySelectorAll(".ap").forEach(i=>i.oninput=()=>{let t=[...document.querySelectorAll(".ap")].reduce((s,x)=>s+(+norm(x.value)||0),0);$("tot").textContent="جمع: "+t+"%"})}function showPrices(){$("prices").innerHTML=isMetal?`<h3>💰 قیمت‌های فعلی</h3><div class="price"><span>طلا</span><b>${money(prices.gold)}</b></div><div class="price"><span>نقره</span><b>${money(prices.silver)}</b></div><div class="price"><span>مس</span><b>${money(prices.copper)}</b></div><div class="small">${lastPriceUpdate?"آخرین بروزرسانی: "+date(lastPriceUpdate)+" | "+time(lastPriceUpdate):"در حال دریافت قیمت آنلاین..."}</div>`:""}async function loadPrices(){try{let a=await fetch("https://api.goldprice.dev/v1/prices?symbol=XAU-USD-SPOT&symbol=XAG-USD-SPOT").then(x=>x.json()),b=await fetch("https://api.goldprice.dev/v1/prices?symbol=HG-USD-FUT").then(x=>x.json()),u=await fetch("https://open.er-api.com/v6/latest/USD").then(x=>x.json()),r=u.rates?.IRR||42000,f=x=>x?.price||x?.value||x?.data?.price;if(f(a?.prices?.["XAU-USD-SPOT"]))prices.gold=f(a.prices["XAU-USD-SPOT"])*r/31.1035;if(f(a?.prices?.["XAG-USD-SPOT"]))prices.silver=f(a.prices["XAG-USD-SPOT"])*r/31.1035;if(f(b?.prices?.["HG-USD-FUT"]))prices.copper=f(b.prices["HG-USD-FUT"])*r/453.592;lastPriceUpdate=new Date();showPrices();if(currentCert)render(currentCert)}catch(e){showPrices()}}function valid(){let n=$("name").value.trim(),nid=norm($("national").value).replace(/\D/g,""),ph=norm($("phone").value).replace(/\D/g,""),am=+norm($("amount").value).replace(/\D/g,""),aa={};document.querySelectorAll(".ap").forEach(i=>aa[i.dataset.k]=+norm(i.value)||0);let t=Object.values(aa).reduce((a,b)=>a+b,0);if(!n||nid.length!=10||!am||!/^09\d{9}$/.test(ph)||t!=100)return null;return{name:n,national:nid,phone:ph,amount:am,alloc:aa,duration:+$("duration").value}}function startSign(){draft=valid();if(!draft)return alert("اطلاعات را کامل کنید؛ کد ملی ۱۰ رقم، تلفن ۱۱ رقم با 09 و جمع درصدها دقیقاً 100٪ باشد.");$("signbox").classList.remove("hidden");window.scrollTo({top:$("signbox").offsetTop,behavior:"smooth"})}let cv=$("canvas"),ctx=cv.getContext("2d"),down=0;function resize(){cv.width=cv.clientWidth*devicePixelRatio;cv.height=cv.clientHeight*devicePixelRatio;ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);ctx.lineWidth=2;ctx.lineCap="round"}resize();addEventListener("resize",resize);["pointerdown","pointermove","pointerup"].forEach(e=>cv.addEventListener(e,a=>{if(e=="pointerdown"){down=1;ctx.beginPath();ctx.moveTo(a.offsetX,a.offsetY)}if(e=="pointermove"&&down){ctx.lineTo(a.offsetX,a.offsetY);ctx.stroke()}if(e=="pointerup")down=0}));function clearSign(){ctx.clearRect(0,0,cv.clientWidth,cv.clientHeight)}function uid(){let x;do{x="PGC-"+Math.floor(10000000+Math.random()*90000000)}while(contracts.some(c=>c.contract==x));return x}function addMonths(d,m){let x=new Date(d);x.setMonth(x.getMonth()+m);return x}function issue(){if(!draft)return;let now=new Date(),end=addMonths(now,draft.duration),c={...draft,metal:isMetal,issued:now.toISOString(),validUntil:end.toISOString(),letter:"PG-"+Math.floor(100000+Math.random()*900000),contract:uid(),signature:cv.toDataURL(),priceAtIssue:{...prices},history:[{d:date(now),t:time(now),text:"صدور گواهی",prices:{...prices}}]};contracts.push(c);save(c);render(c);renderManager()}function save(c){let i=contracts.findIndex(x=>x.contract==c.contract);if(i<0)contracts.push(c);else contracts[i]=c;localStorage.setItem("PG_CONTRACTS",JSON.stringify(contracts));currentCert=c}function liveConvert(){let c=currentCert,f=$("cf").value,t=$("ct").value,p=+norm($("cp").value)||0;if(!c||!c.metal)return alert("این امکان مخصوص سبد فلزات است.");if(f==t)return alert("فلز مبدأ و مقصد باید متفاوت باشند.");if(p<=0||p>c.alloc[f])return alert("درصد تبدیل از موجودی فلز بیشتر است.");let sourcePrice=prices[f],destPrice=prices[t],value=c.amount*p/100,sourceGram=sourcePrice?value/sourcePrice:0,destGram=destPrice?value/destPrice:0,now=new Date();c.alloc[f]-=p;c.alloc[t]+=p;c.history.push({d:date(now),t:time(now),text:`تبدیل ${p}% از ${names(f)} به ${names(t)} | ارزش ${money(value)} | مقدار مبدأ ${sourceGram.toFixed(4)} گرم | مقدار مقصد ${destGram.toFixed(4)} گرم`,live:1,prices:{...prices}});save(c);render(c);renderManager();setTimeout(()=>{if($("liveStatus"))$("liveStatus").textContent="✅ تبدیل ارزش‌محور ثبت شد؛ قیمت لحظه تبدیل و مقدار تقریبی هر دو فلز ذخیره شد و شماره قرارداد ثابت ماند."},30)}function render(c){let rows=Object.entries(c.alloc).map(([k,v])=>`<div class="row"><span>${names(k)}</span><b>${v.toFixed(2)}%</b></div>`).join(""),totalMetal=c.metal?Object.entries(c.alloc).reduce((s,[k,v])=>s+c.amount*v/100,0):c.amount,cards=c.metal?Object.entries(c.alloc).map(([k,v])=>{let p=prices[k],val=c.amount*v/100,g=p?val/p:0;return`<div class="mcard"><b>${k=="gold"?"Au":k=="silver"?"Ag":"Cu"}</b><div>${names(k)}</div><small>${v.toFixed(2)}%</small><br><b>${money(val)}</b><br><small>${g.toFixed(4)} گرم</small><br><small>${(g/1000).toFixed(6)} کیلو</small><br><small>قیمت فعلی: ${money(p)}</small></div>`}).join(""):"";$("result").innerHTML=`<div class="certificate ${c.metal?"":"stock"}"><div class="certtop"><div>${c.metal?'<div class="mine">⛏️</div><div class="minetxt">METAL MINING • PARSGUARD</div>':'🦅'}</div><h2>گواهی رسمی قرارداد سرمایه‌گذاری</h2><div class="meta"><span>شماره نامه: ${c.letter}</span><span>شماره قرارداد: ${c.contract}</span><span>صدور: ${date(c.issued)} | ${time(c.issued)}</span><span>اعتبار تا: ${date(c.validUntil)}</span></div></div><div class="rows"><div class="row"><span>نام مشتری</span><b>${esc(c.name)}</b></div><div class="row"><span>کد ملی</span><b>${c.national}</b></div><div class="row"><span>شماره تلفن</span><b>${c.phone}</b></div><div class="row"><span>مبلغ سرمایه‌گذاری</span><b>${money(c.amount)}</b></div><div class="row"><span>مدت قرارداد</span><b>${c.duration} ماه</b></div><div class="row"><span>ارزش اسمی سبد</span><b>${money(totalMetal)}</b></div><div class="row"><span>نوع قرارداد</span><b>${c.metal?"سبد فلزات":"سبد سهام"}</b></div>${rows}</div>${c.metal?`<div class="metalcards">${cards}</div><div class="livebox"><b>⚡ تبدیل آنلاین داخل همین گواهی</b><div class="livegrid"><div><label>از فلز</label><select id="cf"><option value="gold">طلا</option><option value="silver">نقره</option><option value="copper">مس</option></select></div><div><label>درصد تبدیل از موجودی</label><input id="cp" value="10" inputmode="numeric"></div><div><label>به فلز</label><select id="ct"><option value="silver">نقره</option><option value="gold">طلا</option><option value="copper">مس</option></select></div></div><button class="btn" onclick="liveConvert()">🔄 تبدیل ارزش‌محور و بروزرسانی</button><div class="live-status" id="liveStatus">ارزش تبدیل بر اساس قیمت فعلی مبدأ و مقصد محاسبه می‌شود.</div></div>`:""}<div class="history"><b>📜 سوابق قرارداد و تبدیل‌ها</b>${c.history.map(x=>`<div class="row"><span>${x.d} - ${x.t}</span><span>${esc(x.text)}${x.live?" | 🔄 آنلاین":""}</span></div>`).join("")}</div><div class="signs"><div><img src="${c.signature}" style="max-width:180px;height:60px"><br><b>امضای مشتری</b></div><div><div class="seal">PARSGUARD<br>OFFICIAL</div></div><div><div class="sig">Parsa Karami</div><b>نماینده</b></div></div><button class="btn printbtn" onclick="print()">🖨️ چاپ گواهی A4</button></div>`}function renderManager(){let m=$("manager");if(!contracts.length){m.innerHTML='<div class="small">هنوز قراردادی صادر نشده است.</div>';return}m.innerHTML=contracts.slice().reverse().map(c=>`<div class="contractItem"><b>${c.contract}</b><div>${esc(c.name)}</div><div class="small">${c.metal?"سبد فلزات":"سبد سهام"} | ${date(c.issued)}</div><button class="btn" onclick="openContract('${c.contract}')">مشاهده</button></div>`).join("")}function openContract(id){let c=contracts.find(x=>x.contract==id);if(c){currentCert=c;render(c);window.scrollTo({top:$("result").offsetTop,behavior:"smooth"})}}function esc(s){return String(s||"").replace(/[&<>"']/g,x=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[x]))}["national","phone","amount"].forEach(id=>$(id).addEventListener("input",e=>{let v=norm(e.target.value).replace(/\D/g,"");if(id=="national")v=v.slice(0,10);if(id=="phone"){if(v&&!v.startsWith("0"))v="0"+v;v=v.slice(0,11)}e.target.value=v}));setAlloc();showPrices();renderManager();loadPrices();</script></body></html>
